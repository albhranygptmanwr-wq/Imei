<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Golden Unlocker Pro | Al-Bahrani</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd700; /* لون التميز المفضل لديك */
            --neon-blue: #00f3ff; /* لون النيون للعمليات */
            --bg-dark: #080a12;
            --border: rgba(255, 215, 0, 0.3);
        }

        /* تنسيق الهامش الخارجي */
        body {
            margin: 0;
            padding: 0;
            background-color: #eef2f7; /* الهامش الأبيض */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: auto; /* السماح بالسكرول العرضي إذا كان الجوال صغيراً جداً */
        }

        /* نافذة البرنامج الرئيسية */
        #app-window {
            width: 1100px;
            height: 680px;
            background: var(--bg-dark);
            border-radius: 20px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden; /* يمنع خروج المحتوى عن الحواف الدائرية */
            border: 1px solid var(--border);
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* --- شاشة الدخول --- */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
        }

        #login-page {
            background: radial-gradient(circle at center, #111827, #080a12);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .login-card {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            text-align: center;
        }

        .input-box {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,0,0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            text-align: center;
        }

        .btn-gold {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--gold), #b8860b);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--gold); }

        /* --- واجهة التحكم الرئيسية --- */
        #dashboard-page {
            transform: translateX(100%); /* مخفية لليمين */
            opacity: 0;
            z-index: 1;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 240px;
            background: rgba(0,0,0,0.5);
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            padding-top: 30px;
        }

        .nav-link {
            padding: 15px 30px;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .nav-link.active, .nav-link:hover {
            color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.05);
        }

        /* محتوى العمليات */
        .content {
            flex: 1;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        .op-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
        }

        .btn-action {
            height: 120px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #0062ff, var(--neon-blue));
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn-action:hover { box-shadow: 0 0 30px var(--neon-blue); transform: translateY(-5px); }

        .log-box {
            background: #000;
            border-radius: 15px;
            padding: 15px;
            font-family: monospace;
            color: #4ade80;
            font-size: 13px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            overflow-y: auto;
        }

        /* حالة تسجيل الدخول */
        .logged-in #login-page { transform: translateX(-100%); opacity: 0; }
        .logged-in #dashboard-page { transform: translateX(0); opacity: 1; }

    </style>
</head>
<body>

    <div id="app-window">
        
        <div id="login-page" class="page">
            <div class="login-card">
                <i class="fas fa-crown fa-3x" style="color: var(--gold); margin-bottom: 20px;"></i>
                <h2 style="color: var(--gold); letter-spacing: 2px;">GOLDEN UNLOCKER</h2>
                <p style="color: #666; font-size: 12px; margin-bottom: 30px;">محلات البحراني للهواتف الذكية</p>
                
                <input type="text" class="input-box" placeholder="اسم المستخدم">
                <input type="password" class="input-box" placeholder="كلمة المرور">
                <button class="btn-gold" onclick="doLogin()">تسجيل الدخول</button>
            </div>
        </div>

        <div id="dashboard-page" class="page">
            <aside class="sidebar">
                <div style="text-align: center; color: var(--gold); font-weight: bold; margin-bottom: 40px;">
                    GOLDEN PRO V3
                </div>
                <div class="nav-link active"><i class="fas fa-bolt"></i> العمليات</div>
                <div class="nav-link"><i class="fas fa-signal"></i> Yemen Mobile</div>
                <div class="nav-link"><i class="fas fa-history"></i> السجلات</div>
                <div class="nav-link"><i class="fas fa-cog"></i> الإعدادات</div>
            </aside>

            <main class="content">
                <div class="op-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                        <span style="color: var(--gold);"><i class="fas fa-user"></i> محمد البحراني</span>
                        <span style="color: var(--neon-blue);">الرصيد: 820</span>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <button class="btn-action">DIRECT UNLOCK</button>
                        <button class="btn-action" style="background: rgba(255,255,255,0.05); border: 1px solid var(--gold);">READ CODES</button>
                    </div>

                    <div style="margin-top: 30px; padding: 20px; background: rgba(0,243,255,0.05); border-radius: 12px; border: 1px solid rgba(0,243,255,0.1);">
                        <i class="fas fa-info-circle"></i> حالة الجهاز: SM-S928U متصل
                    </div>
                </div>

                <div class="log-box">
                    <div style="color: #555;">--- Log Started ---</div>
                    <div>[19:40] Checking security patch...</div>
                    <div style="color: var(--neon-blue);">[19:41] VoLTE Patching initialized...</div>
                    <div style="color: var(--gold);">[19:42] Writing signature...</div>
                </div>
            </main>
        </div>

    </div>

    <script>
        function doLogin() {
            // إضافة كلاس تسجيل الدخول لتحريك الصفحات
            document.body.classList.add('logged-in');
        }
    </script>
</body>
</html>
