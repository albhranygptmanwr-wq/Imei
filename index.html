<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البحراني (دقيق جداً)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #222; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: #333; }
        .container { background: white; padding: 15px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); min-height: 90vh; }
        h3 { text-align: center; margin: 0 0 15px 0; color: #2c3e50; font-size: 18px;}

        /* --- منطقة الكاميرا --- */
        #camera-wrapper {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            display: none;
        }
        
        #reader { width: 100%; height: 100%; }
        
        /* الإطار الأخضر */
        .scan-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 260px; height: 90px;
            border: 3px solid #00ff00;
            border-radius: 8px;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
            z-index: 10;
            pointer-events: none;
        }
        .scan-line {
            width: 100%; height: 2px; background: #00ff00;
            position: absolute; top: 0;
            animation: scanAnim 2s infinite linear;
        }
        @keyframes scanAnim { 0% {top: 0;} 50% {top: 100%;} 100% {top: 0;} }

        /* أدوات التحكم (فلاش وزوم) */
        .cam-controls {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            display: flex; gap: 10px; align-items: center; z-index: 20;
        }
        .flash-btn {
            background: rgba(0,0,0,0.5); border: 2px solid white; color: white;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .flash-btn.active { background: #ffc107; border-color: #ffc107; color: black; }
        input[type=range] { flex-grow: 1; accent-color: #00ff00; }

        /* زر التشغيل */
        .main-btn {
            width: 100%; padding: 12px; background-color: #dc3545; color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* الحقول */
        .input-group { margin-bottom: 10px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 13px; color: #555; }
        input.normal-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 16px; font-weight: bold; box-sizing: border-box; }

        /* الرقم الخاص */
        .smart-input-container { display: flex; align-items: center; border: 2px solid #007bff; border-radius: 6px; background-color: #f8f9fa; overflow: hidden; }
        .fixed-part { background-color: #007bff; color: white; padding: 10px; font-weight: bold; font-size: 16px; }
        .user-input { border: none; padding: 8px; font-size: 18px; width: 60px; text-align: center; font-weight: bold; outline: none; color: #d63384; background: white;}
        .random-part { flex-grow: 1; text-align: center; font-family: monospace; font-size: 16px; color: #555; letter-spacing: 1px;}
        .refresh-btn { border: none; background: none; font-size: 20px; cursor: pointer; padding: 0 10px; color: #007bff; }

        /* الأزرار السفلية */
        .action-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-save { background-color: #28a745; }
        .btn-share { background-color: #007bff; }

        /* المعاينة */
        .preview-area { margin-top: 15px; display: flex; justify-content: center; }
        #sticker-box { 
            background-color: white; width: 320px; padding: 20px 10px; 
            text-align: center; border: 1px dashed #ccc; 
            display: flex; flex-direction: column; align-items: center; min-height: 120px;
        }
        .shop-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; font-family: Tahoma; }
        .top-number { font-size: 30px; font-weight: bold; margin-bottom: 10px; font-family: Arial; }
        svg#barcode { width: 100%; height: auto; display: none; }
        .placeholder { color: #999; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h3>نظام البحراني الذكي</h3>

        <button class="main-btn" id="camBtn" onclick="toggleCamera()">📷 تشغيل الكاميرا</button>

        <div id="camera-wrapper">
            <div id="reader"></div>
            <div class="scan-overlay"><div class="scan-line"></div></div>
            <div class="cam-controls">
                <button class="flash-btn" id="flashBtn" onclick="toggleFlash()">⚡</button>
                <input type="range" min="1" max="5" step="0.1" value="1" oninput="applyZoom(this.value)">
                <span style="color:white; font-size:12px; font-weight:bold;">Zoom</span>
            </div>
        </div>

        <div class="input-group">
            <label>رقم الباركود (IMEI):</label>
            <input class="normal-input" type="text" id="barcodeInput" placeholder="" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>اسم المحل:</label>
            <input class="normal-input" type="text" id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>الرقم الخاص:</label>
            <div class="smart-input-container">
                <div class="fixed-part">13</div>
                <input type="number" id="userPart" class="user-input" value="60" oninput="updateLabel()">
                <div class="random-part" id="randomDisplay">------</div>
                <button class="refresh-btn" onclick="generateNewRandom()">🔄</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-save" onclick="saveImage()">💾 حفظ</button>
            <button class="btn btn-share" onclick="shareImage()">📤 مشاركة</button>
        </div>

        <div class="preview-area">
            <div id="sticker-box">
                <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
                <div class="top-number" id="fullNumTxt">---</div>
                <span class="placeholder" id="phText">سيظهر الباركود هنا...</span>
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <script>
        // --- 1. المنطق الأساسي ---
        let currentRandom = "";
        function generateNewRandom() {
            currentRandom = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('randomDisplay').innerText = currentRandom;
            updateLabel();
        }

        function updateLabel() {
            document.getElementById('shopTxt').innerText = document.getElementById('shopInput').value;
            let userVal = document.getElementById('userPart').value;
            if(currentRandom === "") { generateNewRandom(); return; }
            document.getElementById('fullNumTxt').innerText = "13" + userVal + currentRandom;
            
            // الباركود
            let val = document.getElementById('barcodeInput').value;
            let bar = document.getElementById('barcode');
            let ph = document.getElementById('phText');
            
            if(val && val.length > 0) {
                bar.style.display = "block";
                ph.style.display = "none";
                try {
                    JsBarcode("#barcode", val, {
                        format: "CODE128", lineColor: "#000", width: 2.3, height: 60, displayValue: true, fontSize: 18, margin: 0
                    });
                } catch(e) {}
            } else {
                bar.style.display = "none";
                ph.style.display = "block";
            }
        }

        // --- 2. الكاميرا (الفلتر الذكي) ---
        let html5QrCode;
        let isFlashOn = false;

        function toggleCamera() {
            const wrapper = document.getElementById('camera-wrapper');
            const btn = document.getElementById('camBtn');

            if (wrapper.style.display === 'block') {
                if(html5QrCode) {
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                        wrapper.style.display = 'none';
                        btn.innerText = "📷 تشغيل الكاميرا";
                        btn.style.backgroundColor = "#dc3545";
                    });
                }
                return;
            }

            wrapper.style.display = 'block';
            btn.innerText = "❌ إغلاق الكاميرا";
            btn.style.backgroundColor = "#333";

            html5QrCode = new Html5Qrcode("reader");

            // حصر الباركود في النوع المستخدم في الجوالات فقط لمنع الخطأ
            const config = { 
                fps: 20, 
                qrbox: { width: 250, height: 80 },
                aspectRatio: 1.0,
                formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128 ] 
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    // === الفلتر السحري ===
                    // إذا كان النص يحتوي على أي شيء غير الأرقام، تجاهله فوراً
                    if (!/^\d+$/.test(decodedText)) {
                        console.log("تم تجاهل قراءة خاطئة: " + decodedText);
                        return;
                    }
                    
                    // إذا وصل هنا، فهو رقم صحيح
                    document.getElementById('barcodeInput').value = decodedText;
                    updateLabel();
                    if (navigator.vibrate) navigator.vibrate(200);
                    toggleCamera(); // إغلاق تلقائي
                }
            ).catch(err => {
                alert("خطأ في تشغيل الكاميرا");
            });
        }

        function toggleFlash() {
            if(!html5QrCode) return;
            isFlashOn = !isFlashOn;
            html5QrCode.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] });
            document.getElementById('flashBtn').classList.toggle('active');
        }

        function applyZoom(val) {
            if(!html5QrCode) return;
            html5QrCode.applyVideoConstraints({ advanced: [{ zoom: parseFloat(val) }] });
        }

        // --- 3. الحفظ ---
        const captureOptions = { scale: 3, useCORS: true, backgroundColor: "#ffffff" };
        function saveImage() {
            const el = document.getElementById("sticker-box");
            const b = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                const link = document.createElement('a');
                link.download = `Label_${document.getElementById('userPart').value}.png`;
                link.href = canvas.toDataURL();
                link.click();
                el.style.border = b;
            });
        }
        function shareImage() {
            const el = document.getElementById("sticker-box");
            const b = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                canvas.toBlob(blob => {
                    if (navigator.share) navigator.share({ files: [new File([blob], "sticker.png", {type: "image/png"})] });
                    else alert("المشاركة غير مدعومة");
                    el.style.border = b;
                });
            });
        }

        window.onload = function() {
            generateNewRandom();
            document.getElementById('barcodeInput').value = ""; // تفريغ الحقل
            updateLabel();
        };
    </script>

</body>
</html>
