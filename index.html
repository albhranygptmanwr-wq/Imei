<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي (تدوير تلقائي)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: #333; }
        .container { background: white; padding: 15px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h3 { text-align: center; margin: 0 0 15px 0; color: #2c3e50; }

        /* منطقة القص */
        #cropper-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
        .img-container { max-width: 90%; max-height: 60%; overflow: hidden; background: #000; margin-bottom: 20px; border: 2px solid #fff; }
        #image-to-crop { max-width: 100%; display: block; }
        
        .crop-controls { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .btn { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; flex: 1; max-width: 140px; }
        .btn-confirm { background-color: #28a745; }
        .btn-cancel { background-color: #dc3545; }
        .btn-blue { background-color: #007bff; }
        
        /* الكاميرا المباشرة */
        #reader { width: 100%; display: none; margin-bottom: 10px; border-radius: 8px; border: 2px solid #333; background: #000; }

        /* الحقول */
        .input-group { margin-bottom: 12px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 13px; }
        input.normal-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 16px; box-sizing: border-box; }

        /* الرقم الخاص */
        .smart-input-container { display: flex; align-items: center; border: 2px solid #007bff; border-radius: 6px; background-color: #f8f9fa; overflow: hidden; }
        .fixed-part { background-color: #007bff; color: white; padding: 10px; font-weight: bold; }
        .user-input { border: none; padding: 10px; font-size: 18px; width: 60px; text-align: center; font-weight: bold; outline: none; color: #d63384; }
        .random-part { flex-grow: 1; text-align: center; font-family: monospace; font-size: 16px; color: #666; }
        .refresh-btn { border: none; background: none; font-size: 20px; cursor: pointer; padding: 0 10px; }

        /* المعاينة */
        .preview-area { margin-top: 20px; display: flex; justify-content: center; }
        #sticker-box { background-color: white; width: 320px; padding: 20px; text-align: center; border: 1px solid #eee; display: flex; flex-direction: column; align-items: center; }
        .shop-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; font-family: Tahoma; }
        .top-number { font-size: 32px; font-weight: bold; margin-bottom: 10px; font-family: Arial; }
        svg#barcode { width: 100%; height: auto; display: block; }
        
        #scan-status { text-align: center; font-weight: bold; margin: 10px 0; min-height: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h3>نظام الملصقات والماسح</h3>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn btn-blue" onclick="document.getElementById('fileInput').click()">🖼️ قص ومسح</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none" onchange="loadFile(event)">
        </div>
        
        <div id="scan-status"></div>

        <div class="input-group">
            <label>رقم الباركود (IMEI):</label>
            <input class="normal-input" type="text" id="barcodeInput" value="354645091451710" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>اسم المحل:</label>
            <input class="normal-input" type="text" id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>الرقم الخاص:</label>
            <div class="smart-input-container">
                <div class="fixed-part">13</div>
                <input type="number" id="userPart" class="user-input" placeholder="00" value="60" oninput="updateLabel()">
                <div class="random-part" id="randomDisplay">------</div>
                <button class="refresh-btn" onclick="generateNewRandom()">🔄</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn btn-confirm" onclick="saveImage()">💾 حفظ</button>
            <button class="btn btn-blue" onclick="shareImage()">📤 مشاركة</button>
        </div>

        <div class="preview-area">
            <div id="sticker-box">
                <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
                <div class="top-number" id="fullNumTxt">1360843635</div>
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <div id="cropper-modal">
        <h3 style="color: white; margin-bottom: 10px;">حدد الباركود (حتى لو طولي)</h3>
        <div class="img-container">
            <img id="image-to-crop" src="">
        </div>
        <div class="crop-controls">
            <button class="btn btn-confirm" id="cropBtn" onclick="processCrop()">✂️ مسح الآن</button>
            <button class="btn btn-cancel" onclick="closeCropper()">إلغاء</button>
        </div>
        <p style="color: #ddd; font-size: 12px; margin-top: 10px;">سيحاول النظام تدوير الصورة تلقائياً</p>
    </div>

    <div id="reader" style="display:none;"></div>

    <script>
        // --- إعدادات الباركود والملصق ---
        let currentRandom = "";
        function generateNewRandom() {
            currentRandom = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('randomDisplay').innerText = currentRandom;
            updateLabel();
        }

        function updateLabel() {
            document.getElementById('shopTxt').innerText = document.getElementById('shopInput').value;
            let userVal = document.getElementById('userPart').value;
            if(currentRandom === "") { generateNewRandom(); return; }
            document.getElementById('fullNumTxt').innerText = "13" + userVal + currentRandom;
            try {
                JsBarcode("#barcode", document.getElementById('barcodeInput').value, {
                    format: "CODE128", lineColor: "#000", width: 2.3, height: 60, displayValue: true, fontSize: 18, margin: 0
                });
            } catch (e) {}
        }

        // --- منطق القص والمسح الذكي ---
        let cropper;
        const modal = document.getElementById('cropper-modal');
        const imageElement = document.getElementById('image-to-crop');
        const statusDiv = document.getElementById('scan-status');

        function loadFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imageElement.src = e.target.result;
                    modal.style.display = 'flex';
                    if (cropper) { cropper.destroy(); }
                    cropper = new Cropper(imageElement, { viewMode: 1, autoCropArea: 0.6 });
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function closeCropper() {
            modal.style.display = 'none';
            if (cropper) { cropper.destroy(); cropper = null; }
        }

        async function processCrop() {
            if (!cropper) return;
            
            const btn = document.getElementById('cropBtn');
            btn.innerText = "جاري التحليل...";
            
            // 1. الحصول على الصورة المقصوصة
            const canvas = cropper.getCroppedCanvas();
            
            // 2. التحقق مما إذا كانت طولية (Vertical) وتدويرها
            // الباركود العمودي يجب تدويره ليصبح أفقياً للقراءة
            let finalCanvas = canvas;
            
            if (canvas.height > canvas.width) {
                // إنشاء كانفاس جديد للتدوير
                finalCanvas = document.createElement('canvas');
                finalCanvas.width = canvas.height;
                finalCanvas.height = canvas.width;
                const ctx = finalCanvas.getContext('2d');
                
                // تدوير 90 درجة
                ctx.translate(finalCanvas.width / 2, finalCanvas.height / 2);
                ctx.rotate(90 * Math.PI / 180);
                ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
            }

            // 3. تطبيق فلتر التباين (Contrast) لإزالة اللمعة
            const processedCanvas = document.createElement('canvas');
            processedCanvas.width = finalCanvas.width;
            processedCanvas.height = finalCanvas.height;
            const pCtx = processedCanvas.getContext('2d');
            pCtx.filter = 'grayscale(100%) contrast(200%)';
            pCtx.drawImage(finalCanvas, 0, 0);

            // 4. تحويل لملف ومسح
            processedCanvas.toBlob((blob) => {
                const file = new File([blob], "scan_target.jpg", { type: "image/jpeg" });
                attemptScan(file);
            }, 'image/jpeg', 1.0);
        }

        function attemptScan(file) {
            const html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.scanFileV2(file, true)
            .then(decodedText => {
                document.getElementById('barcodeInput').value = decodedText;
                updateLabel();
                statusDiv.innerText = "✅ تم القراءة بنجاح!";
                statusDiv.style.color = "green";
                closeCropper();
            })
            .catch(err => {
                statusDiv.innerText = "❌ فشل. جرب تحديد الباركود فقط بدون حواف.";
                statusDiv.style.color = "red";
                document.getElementById('cropBtn').innerText = "حاول مجدداً";
            });
        }

        // --- الحفظ والمشاركة ---
        const captureOptions = { scale: 3, useCORS: true, backgroundColor: "#ffffff" };
        function saveImage() {
            const el = document.getElementById("sticker-box");
            const border = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                const link = document.createElement('a');
                link.download = `Label_${document.getElementById('userPart').value}.png`;
                link.href = canvas.toDataURL();
                link.click();
                el.style.border = border;
            });
        }

        function shareImage() {
            const el = document.getElementById("sticker-box");
            const border = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                canvas.toBlob(blob => {
                    if (navigator.share) {
                        navigator.share({ files: [new File([blob], "sticker.png", {type: "image/png"})], title: 'ملصق' });
                    } else { alert("المشاركة غير مدعومة"); }
                    el.style.border = border;
                });
            });
        }

        window.onload = generateNewRandom;
    </script>

</body>
</html>
