<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح الذكي (قص + معالجة)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <link  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            color: #333;
        }

        .container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h3 { text-align: center; margin: 0 0 15px 0; color: #2c3e50; font-size: 18px; }

        /* منطقة القص */
        .crop-container {
            width: 100%;
            height: 300px;
            background: #333;
            display: none; /* مخفي حتى يتم اختيار صورة */
            margin-bottom: 10px;
        }
        #image-to-crop {
            max-width: 100%;
            max-height: 100%;
        }

        /* أزرار التحكم */
        .controls-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn-cam { background: #dc3545; }
        .btn-upload { background: #6c757d; }
        .btn-process { background: #007bff; display: none; } /* يظهر بعد اختيار الصورة */

        /* المدخلات */
        .input-group { margin-bottom: 12px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 13px; }
        input.normal-input {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;
            text-align: center; font-size: 16px; box-sizing: border-box;
        }

        /* الحقل المركب */
        .smart-input-container {
            display: flex; align-items: center; border: 2px solid #007bff;
            border-radius: 6px; background-color: #f8f9fa; overflow: hidden;
        }
        .fixed-part { background-color: #007bff; color: white; padding: 10px; font-weight: bold; }
        .user-input {
            border: none; padding: 8px; font-size: 18px; width: 60px;
            text-align: center; font-weight: bold; outline: none; color: #d63384;
        }
        .random-part { flex-grow: 1; text-align: center; color: #666; font-family: monospace; font-size: 16px; }
        .refresh-btn { border: none; background: none; font-size: 20px; padding: 0 10px; cursor: pointer; }

        /* منطقة الكاميرا المباشرة */
        #reader { width: 100%; display: none; margin-bottom: 10px; border: 2px solid #000; }

        /* المعاينة */
        #sticker-box {
            background: white; width: 320px; padding: 20px; margin: 20px auto;
            text-align: center; border: 1px dashed #ccc;
        }
        .shop-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .top-number { font-size: 30px; font-weight: bold; margin: 5px 0 10px 0; font-family: Arial; }
        svg#barcode { width: 100%; height: auto; display: block; }

        /* أزرار الحفظ */
        .save-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-save { background: #28a745; flex: 1; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; }
        .btn-share { background: #17a2b8; flex: 1; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; }

        #status-msg { text-align: center; font-size: 12px; color: #d63384; min-height: 20px; margin-bottom: 5px;}
    </style>
</head>
<body>

<div class="container">
    <h3>نظام الملصقات (القص + المعالجة)</h3>

    <div id="status-msg"></div>

    <div id="reader"></div>

    <div class="crop-container">
        <img id="image-to-crop" src="">
    </div>

    <div class="controls-row">
        <button class="btn btn-cam" onclick="startCamera()">📷 مباشر</button>
        <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">🖼️ من صورة</button>
        <input type="file" id="file-input" accept="image/*" style="display: none" onchange="loadFile(event)">
    </div>
    
    <button id="btn-process" class="btn btn-process" onclick="processAndScan()" style="width:100%; margin-bottom:15px;">✂️ قص ومسح الباركود</button>


    <div class="input-group">
        <label>رقم IMEI:</label>
        <input class="normal-input" type="text" id="barcodeInput" value="354645091451710" oninput="updateLabel()">
    </div>

    <div class="input-group">
        <label>اسم المحل:</label>
        <input class="normal-input" type="text" id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
    </div>

    <div class="input-group">
        <label>الرقم الخاص:</label>
        <div class="smart-input-container">
            <div class="fixed-part">13</div>
            <input type="number" id="userPart" class="user-input" placeholder="00" value="60" oninput="updateLabel()">
            <div class="random-part" id="randomDisplay">------</div>
            <button class="refresh-btn" onclick="generateNewRandom()">🔄</button>
        </div>
    </div>

    <div class="save-btns">
        <button class="btn-save" onclick="saveImage()">💾 حفظ</button>
        <button class="btn-share" onclick="shareImage()">📤 مشاركة</button>
    </div>

    <div id="sticker-box">
        <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
        <div class="top-number" id="fullNumTxt">1360843635</div>
        <svg id="barcode"></svg>
    </div>
</div>

<canvas id="processing-canvas" style="display:none;"></canvas>

<script>
    // ---------------------------------------------------------
    // 1. منطق القص (Cropper.js)
    // ---------------------------------------------------------
    let cropper;
    const imageElement = document.getElementById('image-to-crop');
    const cropContainer = document.querySelector('.crop-container');
    const processBtn = document.getElementById('btn-process');
    const statusMsg = document.getElementById('status-msg');

    function loadFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        // إخفاء الكاميرا إذا كانت مفتوحة
        stopCamera();

        const reader = new FileReader();
        reader.onload = function(e) {
            imageElement.src = e.target.result;
            cropContainer.style.display = 'block';
            processBtn.style.display = 'flex';
            
            // تهيئة Cropper
            if (cropper) { cropper.destroy(); }
            cropper = new Cropper(imageElement, {
                viewMode: 1,
                autoCropArea: 0.8, // تحديد تلقائي لـ 80% من الصورة
                ready() {
                    statusMsg.innerText = "حدد الباركود بالمربع ثم اضغط 'قص ومسح'";
                }
            });
        };
        reader.readAsDataURL(file);
    }

    // ---------------------------------------------------------
    // 2. منطق المعالجة والمسح (القلب النابض)
    // ---------------------------------------------------------
    async function processAndScan() {
        if (!cropper) return;

        statusMsg.innerText = "جاري المعالجة والقراءة...";

        // 1. الحصول على الصورة المقصوصة
        const croppedCanvas = cropper.getCroppedCanvas();
        if (!croppedCanvas) return;

        // 2. محاولة القراءة الأولى (الصورة المقصوصة الأصلية)
        let scanned = await scanCanvas(croppedCanvas);
        
        if (!scanned) {
            // 3. إذا فشل، نطبق "فلتر التباين العالي" (High Contrast)
            statusMsg.innerText = "تعذر القراءة، جاري تطبيق فلتر التباين...";
            const filteredCanvas = applyHighContrastFilter(croppedCanvas);
            scanned = await scanCanvas(filteredCanvas);
        }

        if (scanned) {
            statusMsg.innerText = "✅ تم القراءة بنجاح!";
            // إخفاء أدوات القص
            cropContainer.style.display = 'none';
            processBtn.style.display = 'none';
            if (cropper) { cropper.destroy(); cropper = null; }
        } else {
            statusMsg.innerText = "❌ فشل القراءة. تأكد من تحديد الباركود بدقة.";
        }
    }

    // دالة مسح الكانفاس
    function scanCanvas(canvas) {
        return new Promise((resolve) => {
            const html5QrCode = new Html5Qrcode("reader"); // نستخدم معرف وهمي للقارئ
            
            html5QrCode.scanFileV2(canvas.toDataURL('image/png'), true)
            .then(decodedText => {
                document.getElementById('barcodeInput').value = decodedText.decodedText;
                updateLabel();
                resolve(true);
            })
            .catch(err => {
                console.log("Scan failed on this pass");
                resolve(false);
            });
        });
    }

    // فلتر معالجة الصورة (يحولها لأبيض وأسود صارخ)
    function applyHighContrastFilter(sourceCanvas) {
        const ctx = sourceCanvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
        const data = imgData.data;

        // تحويل كل بكسل
        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            // تحويل للرمادي
            const gray = (r + g + b) / 3;
            // تطبيق عتبة (Threshold) - إذا فاتح خليه أبيض، غامق خليه أسود
            // الرقم 128 هو المنتصف، يمكن تعديله لزيادة الحساسية
            const val = gray > 100 ? 255 : 0;

            data[i] = val;     // R
            data[i + 1] = val; // G
            data[i + 2] = val; // B
        }

        // إنشاء كانفاس جديد بالبيانات المعالجة
        const newCanvas = document.createElement('canvas');
        newCanvas.width = sourceCanvas.width;
        newCanvas.height = sourceCanvas.height;
        newCanvas.getContext('2d').putImageData(imgData, 0, 0);
        return newCanvas;
    }

    // ---------------------------------------------------------
    // 3. الكاميرا المباشرة
    // ---------------------------------------------------------
    let html5QrcodeScanner;
    function startCamera() {
        // إخفاء القص
        if (cropper) { cropper.destroy(); cropper = null; }
        cropContainer.style.display = 'none';
        processBtn.style.display = 'none';

        const readerDiv = document.getElementById('reader');
        if (readerDiv.style.display === 'block') { stopCamera(); return; }
        
        readerDiv.style.display = 'block';
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 15, qrbox: { width: 280, height: 100 }, experimentalFeatures: { useBarCodeDetectorIfSupported: true } },
            (decodedText) => {
                document.getElementById('barcodeInput').value = decodedText;
                updateLabel();
                stopCamera();
                statusMsg.innerText = "✅ تم القراءة من الكاميرا";
            },
            () => {}
        );
    }

    function stopCamera() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                html5QrcodeScanner.clear();
            });
        }
    }

    // ---------------------------------------------------------
    // 4. وظائف الملصق الأساسية
    // ---------------------------------------------------------
    let currentRandom = "";
    function generateNewRandom() {
        currentRandom = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('randomDisplay').innerText = currentRandom;
        updateLabel();
    }

    function updateLabel() {
        document.getElementById('shopTxt').innerText = document.getElementById('shopInput').value;
        let userVal = document.getElementById('userPart').value;
        if(currentRandom === "") { generateNewRandom(); return; }
        document.getElementById('fullNumTxt').innerText = "13" + userVal + currentRandom;
        try {
            JsBarcode("#barcode", document.getElementById('barcodeInput').value, {
                format: "CODE128", lineColor: "#000", width: 2.3, height: 60, displayValue: true, fontSize: 18, margin: 0
            });
        } catch (e) {}
    }

    // الحفظ والمشاركة
    const captureOptions = { scale: 3, useCORS: true, backgroundColor: "#ffffff" };
    function saveImage() {
        const el = document.getElementById("sticker-box");
        const border = el.style.border; el.style.border = "none";
        html2canvas(el, captureOptions).then(c => {
            const link = document.createElement('a');
            link.download = `Label_${document.getElementById('userPart').value}.png`;
            link.href = c.toDataURL("image/png"); link.click();
            el.style.border = border;
        });
    }
    function shareImage() {
        const el = document.getElementById("sticker-box");
        const border = el.style.border; el.style.border = "none";
        html2canvas(el, captureOptions).then(c => {
            c.toBlob(blob => {
                if (navigator.share) {
                    navigator.share({ files: [new File([blob], "sticker.png", { type: "image/png" })], title: 'ملصق' });
                } else { alert("المشاركة غير مدعومة"); }
                el.style.border = border;
            });
        });
    }

    window.onload = function() { generateNewRandom(); };
</script>

</body>
</html>
