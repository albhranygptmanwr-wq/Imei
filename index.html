<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح IMEI الذكي (فلتر دقيق)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #222; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: #333; }
        .container { background: white; padding: 15px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h3 { text-align: center; margin: 0 0 15px 0; color: #2c3e50; }

        /* منطقة الكاميرا */
        #camera-container {
            position: relative; width: 100%; height: 280px; background: #000;
            border-radius: 12px; overflow: hidden; margin-bottom: 10px; display: none;
        }
        #reader { width: 100%; height: 100%; object-fit: cover; }

        /* المستطيل الدليل */
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 70px; /* مستطيل عريض جداً ومناسب للـ IMEI */
            border: 2px solid rgba(0, 255, 0, 0.8); /* أخضر للتركيز */
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.6);
            border-radius: 4px; z-index: 10; pointer-events: none;
        }
        .scan-line { width: 100%; height: 2px; background: #0f0; position: absolute; top: 0; animation: scanAnim 2s infinite linear; }
        @keyframes scanAnim { 0% {top: 0;} 50% {top: 100%;} 100% {top: 0;} }

        /* رسالة الحالة فوق الكاميرا */
        #cam-feedback {
            position: absolute; bottom: 10px; left: 0; right: 0;
            text-align: center; color: white; font-weight: bold; font-size: 14px;
            text-shadow: 1px 1px 2px black; z-index: 20;
        }

        /* أدوات التحكم */
        .camera-controls { display: flex; gap: 10px; align-items: center; justify-content: center; background: #f1f3f5; padding: 8px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .icon-btn { background: white; border: 1px solid #ccc; border-radius: 50%; width: 35px; height: 35px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn.active { background-color: #ffc107; border-color: #ffc107; }
        .zoom-slider-container { flex-grow: 1; display: flex; align-items: center; gap: 5px; }
        input[type=range] { width: 100%; }

        /* زر التشغيل */
        .main-scan-btn {
            width: 100%; padding: 12px; background-color: #dc3545; color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;
        }

        /* الحقول */
        .input-group { margin-bottom: 10px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 13px; }
        input.normal-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 16px; font-weight: bold; box-sizing: border-box; }

        .smart-input-container { display: flex; align-items: center; border: 2px solid #007bff; border-radius: 8px; background-color: #f8f9fa; overflow: hidden; }
        .fixed-part { background-color: #007bff; color: white; padding: 10px; font-weight: bold; font-size: 16px; }
        .user-input { border: none; padding: 8px; font-size: 18px; width: 60px; text-align: center; font-weight: bold; outline: none; color: #d63384; }
        .random-part { flex-grow: 1; text-align: center; font-family: monospace; font-size: 16px; color: #555; }
        .refresh-btn { border: none; background: none; font-size: 20px; cursor: pointer; padding: 0 10px; }

        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-save { background-color: #28a745; }
        .btn-share { background-color: #007bff; }

        .preview-area { margin-top: 20px; display: flex; justify-content: center; }
        #sticker-box { background-color: white; width: 320px; padding: 20px 10px; text-align: center; border: 1px solid #eee; display: flex; flex-direction: column; align-items: center; }
        .shop-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; font-family: Tahoma; }
        .top-number { font-size: 30px; font-weight: bold; margin-bottom: 8px; font-family: Arial; }
        svg#barcode { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h3>نظام فلتر الـ IMEI الذكي</h3>

        <div id="camera-container">
            <div id="reader"></div>
            <div class="scan-overlay"><div class="scan-line"></div></div>
            <div id="cam-feedback">وجّه الكاميرا نحو الباركود</div>
        </div>

        <div class="camera-controls" id="cam-tools">
            <button class="icon-btn" id="flashBtn" onclick="toggleFlash()">⚡</button>
            <div class="zoom-slider-container">
                <span>🔍</span>
                <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" oninput="applyZoom(this.value)" disabled>
            </div>
        </div>

        <button class="main-scan-btn" id="startBtn" onclick="startCamera()">📷 تشغيل الكاميرا</button>

        <div class="input-group">
            <label>رقم الباركود (IMEI فقط):</label>
            <input class="normal-input" type="text" id="barcodeInput" value="354645091451710" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>اسم المحل:</label>
            <input class="normal-input" type="text" id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>الرقم الخاص:</label>
            <div class="smart-input-container">
                <div class="fixed-part">13</div>
                <input type="number" id="userPart" class="user-input" placeholder="00" value="60" oninput="updateLabel()">
                <div class="random-part" id="randomDisplay">------</div>
                <button class="refresh-btn" onclick="generateNewRandom()">🔄</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-save" onclick="saveImage()">💾 حفظ</button>
            <button class="btn btn-share" onclick="shareImage()">📤 مشاركة</button>
        </div>

        <div class="preview-area">
            <div id="sticker-box">
                <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
                <div class="top-number" id="fullNumTxt">1360843635</div>
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <script>
        // --- 1. المنطق الأساسي ---
        let currentRandom = "";
        function generateNewRandom() {
            currentRandom = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('randomDisplay').innerText = currentRandom;
            updateLabel();
        }

        function updateLabel() {
            document.getElementById('shopTxt').innerText = document.getElementById('shopInput').value;
            let userVal = document.getElementById('userPart').value;
            if(currentRandom === "") { generateNewRandom(); return; }
            document.getElementById('fullNumTxt').innerText = "13" + userVal + currentRandom;
            try {
                JsBarcode("#barcode", document.getElementById('barcodeInput').value, {
                    format: "CODE128", lineColor: "#000", width: 2.3, height: 60, displayValue: true, fontSize: 18, margin: 0
                });
            } catch (e) {}
        }

        // --- 2. الكاميرا المتقدمة مع الفلتر الذكي ---
        let html5QrCode;
        let isFlashOn = false;

        function startCamera() {
            const camContainer = document.getElementById('camera-container');
            const startBtn = document.getElementById('startBtn');
            const feedback = document.getElementById('cam-feedback');

            if (camContainer.style.display === 'block') {
                if(html5QrCode) { 
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                        camContainer.style.display = 'none';
                        document.getElementById('cam-tools').style.display = 'none';
                        startBtn.innerText = "📷 تشغيل الكاميرا";
                        startBtn.style.backgroundColor = "#dc3545";
                        feedback.innerText = "وجّه الكاميرا نحو الباركود";
                    });
                }
                return;
            }

            camContainer.style.display = 'block';
            startBtn.innerText = "❌ إغلاق";
            startBtn.style.backgroundColor = "#333";

            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 20, 
                // جعلنا منطقة المسح أضيق لتركز على سطر واحد فقط
                qrbox: { width: 280, height: 60 }, 
                aspectRatio: 1.0,
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                enableCameraControls();
            });
        }

        function onScanSuccess(decodedText) {
            const feedback = document.getElementById('cam-feedback');

            // --- الفلتر الذكي ---
            
            // 1. فحص هل النص يحتوي على حروف؟ (IMEI أرقام فقط)
            // إذا كان يحتوي على حروف (مثل R28...) نرفضه
            if (/[a-zA-Z]/.test(decodedText)) {
                feedback.innerText = "⚠️ تم تجاهل السيريال (SN).. ابحث عن IMEI";
                feedback.style.color = "orange";
                return; // لا تكمل الكود، استمر في المسح
            }

            // 2. فحص الطول (IMEI عادة 15 رقم)
            // نتجاهل الأرقام القصيرة جداً
            if (decodedText.length < 14) {
                feedback.innerText = "⚠️ الرقم قصير جداً.. حاول مجدداً";
                return;
            }

            // --- إذا وصل هنا، فهو IMEI صحيح ---
            feedback.innerText = "✅ تم التقاط IMEI بنجاح!";
            feedback.style.color = "#0f0";
            
            document.getElementById('barcodeInput').value = decodedText;
            updateLabel();
            
            // اهتزاز للنجاح
            if (navigator.vibrate) navigator.vibrate(200);

            // إغلاق الكاميرا
            setTimeout(() => {
                startCamera(); // دالة الإغلاق
            }, 500); 
        }

        // --- الفلاش والزوم ---
        function enableCameraControls() {
            try {
                document.getElementById('cam-tools').style.display = 'flex';
                document.getElementById('zoomSlider').disabled = false;
            } catch (e) {}
        }

        function toggleFlash() {
            if (!html5QrCode) return;
            isFlashOn = !isFlashOn;
            const btn = document.getElementById('flashBtn');
            html5QrCode.applyVideoConstraints({ advanced: [{ torch: isFlashOn }] })
            .then(() => {
                if(isFlashOn) btn.classList.add('active'); else btn.classList.remove('active');
            }).catch(() => { isFlashOn = !isFlashOn; });
        }

        function applyZoom(val) {
            if (!html5QrCode) return;
            html5QrCode.applyVideoConstraints({ advanced: [{ zoom: parseFloat(val) }] });
        }

        // --- الحفظ والمشاركة ---
        const captureOptions = { scale: 3, useCORS: true, backgroundColor: "#ffffff" };
        function saveImage() {
            const el = document.getElementById("sticker-box");
            const border = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                const link = document.createElement('a');
                link.download = `Label_${document.getElementById('userPart').value}.png`;
                link.href = canvas.toDataURL();
                link.click();
                el.style.border = border;
            });
        }
        function shareImage() {
            const el = document.getElementById("sticker-box");
            const border = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                canvas.toBlob(blob => {
                    if (navigator.share) {
                        navigator.share({ files: [new File([blob], "sticker.png", {type: "image/png"})], title: 'ملصق' });
                    } else { alert("المشاركة غير مدعومة"); }
                    el.style.border = border;
                });
            });
        }

        window.onload = generateNewRandom;
    </script>

</body>
</html>
