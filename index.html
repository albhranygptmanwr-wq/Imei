<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Label PDF – MS-B58A</title>

  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial;margin:16px;background:#0b0f14;color:#e8eef6}
    .card{background:#121a24;border:1px solid #223042;border-radius:14px;padding:14px;max-width:560px}
    label{display:block;margin:10px 0 6px;color:#bcd0ea;font-size:14px}
    input,button{
      width:100%;box-sizing:border-box;padding:12px;border-radius:12px;
      border:1px solid #2a3b52;background:#0f1620;color:#e8eef6;font-size:16px
    }
    button{cursor:pointer;background:#1d6cff;border:none;margin-top:10px}
    button.secondary{background:#2a3b52}
    .row{display:flex;gap:10px}
    .row>div{flex:1}
    .hint{font-size:13px;color:#9bb3d1;margin-top:10px;line-height:1.6}
    .ok{color:#6ee7a8}.err{color:#ff8a8a}
    #videoWrap{margin-top:10px;display:none}
    video{width:100%;border-radius:14px;border:1px solid #223042;background:#000}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#0f1620;border:1px solid #223042;margin-top:10px}
    .small{font-size:12px;opacity:.9}
  </style>

  <!-- Barcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <!-- PDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- Scanner fallback -->
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
</head>

<body>
  <div class="card">
    <h2 style="margin:0 0 8px">Label PDF (MS-B58A)</h2>
    <div class="hint small">
      إعدادات الطباعة: <b>Scale 100%</b> – أوقف <b>Fit / Auto resize</b>.
      <br>المقاس مضبوط لمنع التقطيع.
    </div>

    <label>IMEI</label>
    <input id="imei" inputmode="numeric" placeholder="اقرأ بالكيمرا أو اكتب" maxlength="20">

    <div class="row">
      <div><button id="btnScan" class="secondary">📷 تصوير وقراءة الباركود</button></div>
      <div><button id="btnStop" class="secondary" style="display:none">⛔ إيقاف</button></div>
    </div>

    <div id="videoWrap">
      <video id="video" playsinline muted></video>
      <div class="badge" id="scanStatus">جاهز…</div>
    </div>

    <label>السعر (رقمين فقط مثل: 22)</label>
    <input id="price" inputmode="numeric" placeholder="مثال: 22" maxlength="2">

    <button id="btnPdf">⬇️ تنزيل PDF</button>

    <div class="hint" id="msg"></div>
    <div class="hint small">
      الكبير: <span class="ok">13 + السعر (رقمين) + 6 عشوائي</span> (بعد 13 = 8 أرقام)
    </div>
  </div>

<script>
  const $ = (id)=>document.getElementById(id);
  const msg = (t, ok=true)=>{ $("msg").innerHTML = `<span class="${ok?'ok':'err'}">${t}</span>`; };

  // ===== MS-B58A FINAL SIZE =====
  const LABEL_W_PX = 375;
  const LABEL_H_PX = 178;     // رقم ذهبي يمنع التقطيع
  const PX_TO_PT = 0.75;      // تحويل ثابت للـ PDF

  function digitsOnly(v){ return String(v||"").replace(/\D+/g,''); }
  function cleanImei(v){ return digitsOnly(v).slice(0, 20); }

  function randomDigits(len){
    let s = "";
    for (let i=0;i<len;i++) s += Math.floor(Math.random()*10);
    return s;
  }

  // 13 + price(2) + random => بعد 13 = 8
  function makePricingCode(priceRaw){
    const p = digitsOnly(priceRaw);
    if (p.length !== 2) return null;
    return "13" + p + randomDigits(6);
  }

  function makeBarcodePngDataUrl(imei){
    const c = document.createElement("canvas");
    JsBarcode(c, imei, { format:"CODE128", displayValue:false, margin:0, height:64 });
    return c.toDataURL("image/png");
  }

  // ===== Scanner =====
  let stream=null, quaggaRunning=false;

  async function startScan(){
    $("videoWrap").style.display="block";
    $("btnStop").style.display="block";
    $("scanStatus").textContent="فتح الكيمرا…";

    if ("BarcodeDetector" in window){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
        const v=$("video"); v.srcObject=stream; await v.play();
        const detector = new BarcodeDetector({ formats:["code_128","ean_13","qr_code","upc_a","upc_e","data_matrix","codabar","itf"] });
        $("scanStatus").textContent="وجّه الكيمرا على باركود IMEI…";

        const tick = async ()=>{
          if(!stream) return;
          try{
            const res = await detector.detect(v);
            if(res && res.length){
              const imei = cleanImei(res[0].rawValue||"");
              if(imei.length>=10){
                $("imei").value=imei;
                $("scanStatus").textContent="✅ تم القراءة";
                stopScan(); return;
              }
            }
          }catch(e){}
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }catch(e){
        msg("لازم HTTPS وصلاحية كاميرا.", false);
        stopScan();
      }
    } else {
      $("scanStatus").textContent="وجّه الكيمرا على الباركود…";
      Quagga.init({
        inputStream:{ name:"Live", type:"LiveStream", target:$("videoWrap"), constraints:{ facingMode:"environment" } },
        decoder:{ readers:["code_128_reader","ean_reader","ean_13_reader","upc_reader","upc_e_reader","codabar_reader","i2of5_reader"] },
        locate:true
      }, (err)=>{
        if(err){ msg("فشل تشغيل القارئ.", false); return; }
        Quagga.start(); quaggaRunning=true;
      });
      Quagga.onDetected((data)=>{
        const imei = cleanImei(data?.codeResult?.code||"");
        if(imei.length>=10){
          $("imei").value=imei;
          $("scanStatus").textContent="✅ تم القراءة";
          stopScan();
        }
      });
    }
  }

  function stopScan(){
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if(quaggaRunning){ try{Quagga.stop()}catch(e){} quaggaRunning=false; try{Quagga.offDetected()}catch(e){} }
    $("videoWrap").style.display="none";
    $("btnStop").style.display="none";
  }

  $("btnScan").onclick=()=>{ msg(""); startScan(); };
  $("btnStop").onclick=()=>{ stopScan(); msg("تم إيقاف الكيمرا."); };

  // ===== Download PDF directly =====
  $("btnPdf").onclick=()=>{
    const imei = cleanImei($("imei").value);
    const price = digitsOnly($("price").value);
    if(!imei || imei.length<10) return msg("دخل IMEI صحيح.", false);
    if(price.length!==2) return msg("السعر لازم رقمين فقط.", false);

    const code = makePricingCode(price);
    if(!code) return msg("السعر لازم رقمين فقط.", false);

    const { jsPDF } = window.jspdf;
    const pageW = LABEL_W_PX * PX_TO_PT;
    const pageH = LABEL_H_PX * PX_TO_PT;

    const doc = new jsPDF({
      orientation: (pageW>=pageH)?"landscape":"portrait",
      unit:"pt",
      format:[pageW, pageH]
    });

    // Border
    doc.setDrawColor(0); doc.setLineWidth(1);
    doc.rect(1,1,pageW-2,pageH-2);

    // BIG pricing code
    doc.setFont("helvetica","bold");
    let fs=34; doc.setFontSize(fs);
    while(fs>18 && doc.getTextWidth(code)>(pageW-20)){ fs--; doc.setFontSize(fs); }
    doc.text(code, pageW/2, 40, {align:"center"});

    // Barcode
    const img = makeBarcodePngDataUrl(imei);
    const margin=10;
    const by=52;
    const bh=pageH-by-34;
    doc.addImage(img,"PNG",margin,by,pageW-margin*2,bh,undefined,"FAST");

    // IMEI
    doc.setFontSize(16);
    doc.text(imei, pageW/2, pageH-14, {align:"center"});

    // Direct download
    doc.save(`Label_${imei}.pdf`);
    msg("✅ تم تنزيل PDF مباشرة.", true);
  };
</script>
</body>
</html>
