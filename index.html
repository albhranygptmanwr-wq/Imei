<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الماسح الهجين</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>
body {
    font-family: Tahoma, Arial;
    background:#222;
    margin:0;
    padding:10px;
    display:flex;
    justify-content:center;
}

.container {
    background:#fff;
    width:100%;
    max-width:400px;
    padding:15px;
    border-radius:16px;
}

/* ====== الملصق (نسخة الصورة) ====== */

.preview-area {
    margin-top:25px;
    display:flex;
    justify-content:center;
}

#sticker-box {
    width:380px;
    background:#fff;
    padding:20px 10px 18px;
    text-align:center;
}

.shop-name {
    font-size:28px;
    font-weight:bold;
    margin-bottom:6px;
}

.top-number {
    font-size:44px;
    font-weight:900;
    margin-bottom:8px;
    letter-spacing:1px;
}

#barcode {
    width:100%;
    height:90px;
}

.barcode-text {
    margin-top:4px;
    font-size:18px;
    letter-spacing:2px;
    font-weight:bold;
}

/* ====== الباقي (كما هو) ====== */

.main-scan-btn {
    width:100%;
    padding:14px;
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.input-group {
    margin-bottom:10px;
}

input {
    width:100%;
    padding:12px;
    font-size:18px;
    text-align:center;
    border:1px solid #ccc;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<button class="main-scan-btn" onclick="toggleCamera()">📷 تشغيل الكاميرا</button>

<div class="input-group">
    <input id="barcodeInput" placeholder="رقم الباركود" oninput="updateLabel()">
</div>

<div class="input-group">
    <input id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
</div>

<div class="input-group">
    <input id="userPart" value="60" oninput="updateLabel()">
</div>

<button onclick="saveImage()">💾 حفظ</button>

<div class="preview-area">
    <div id="sticker-box">
        <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
        <div class="top-number" id="fullNumTxt">1360843635</div>
        <svg id="barcode"></svg>
        <div class="barcode-text" id="barcodeTxt">354645091451710</div>
    </div>
</div>

</div>

<script>
let currentRandom = "0843635";

function updateLabel(){
    const shop = shopInput.value;
    const user = userPart.value;
    const code = barcodeInput.value;

    shopTxt.innerText = shop;
    fullNumTxt.innerText = "13" + user + currentRandom;
    barcodeTxt.innerText = code;

    if(code.length){
        JsBarcode("#barcode", code, {
            format:"CODE128",
            lineColor:"#000",
            width:2.8,
            height:70,
            displayValue:false,
            margin:0
        });
    }
}

function saveImage(){
    html2canvas(document.getElementById("sticker-box"),{
        scale:3,
        backgroundColor:"#fff"
    }).then(c=>{
        const a=document.createElement("a");
        a.download="sticker.png";
        a.href=c.toDataURL();
        a.click();
    });
}

window.onload = updateLabel;
</script>

</body>
</html>
