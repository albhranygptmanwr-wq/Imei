<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طباعة 58mm مخصص</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #222; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: #333; }
        .container { background: white; padding: 10px; border-radius: 12px; width: 100%; max-width: 380px; }
        
        /* --- الكاميرا --- */
        #camera-wrapper {
            position: relative; width: 100%; height: 200px; background: #000;
            border-radius: 8px; overflow: hidden; margin-bottom: 10px; display: none;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* --- أدوات التحكم --- */
        .controls-area { background: #f0f0f0; padding: 8px; border-radius: 8px; margin-bottom: 10px; }
        .align-btn-group { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
        .align-btn { padding: 5px 15px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .align-btn.active { background: #007bff; color: white; border-color: #007bff; }
        
        .input-group { margin-bottom: 8px; text-align: right; }
        input.normal-input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; }
        
        .main-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; margin-top: 5px; }
        .btn-cam { background: #dc3545; }
        .btn-save { background: #28a745; }

        /* --- تصميم القماش (Canvas) --- */
        .preview-area { 
            margin-top: 15px; padding: 10px; background: #333; border-radius: 8px; 
            display: flex; justify-content: center; overflow: hidden;
        }

        /* هذا الصندوق يمثل ورقة الـ 58mm كاملة */
        #paper-canvas {
            width: 58mm;  /* العرض الثابت للطابعة */
            height: 25mm; /* ارتفاع الملصق */
            background-color: white; 
            display: flex;
            align-items: center;
            justify-content: flex-end; /* الافتراضي يمين */
            overflow: hidden;
            padding: 0;
            /* حدود بيضاء ليفهم المستخدم أنها ورقة */
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* هذا الصندوق يمثل الملصق الفعلي 38mm */
        .sticker-content {
            width: 38mm; 
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* خلفية شفافة أو بيضاء */
            background: white;
        }

        .shop-name { font-size: 8px; font-weight: 800; font-family: Tahoma; margin-bottom: 2px; white-space: nowrap; }
        .top-number { font-size: 22px; font-weight: 900; font-family: Arial; margin: 0; line-height: 1; letter-spacing: 0.5px; }
        svg#barcode { width: 95%; height: 30px; display: block; }

    </style>
</head>
<body>

    <div class="container">
        <h4 style="text-align:center; margin:5px 0;">محاذاة الطباعة (58mm)</h4>
        
        <div id="camera-wrapper">
            <video id="scanVideo" playsinline muted autoplay></video>
        </div>
        <button class="main-btn btn-cam" id="toggleBtn" onclick="toggleCamera()">📷 الكاميرا</button>

        <div class="controls-area">
            <div class="input-group">
                <input class="normal-input" type="text" id="barcodeInput" placeholder="باركود..." oninput="updateLabel()">
            </div>
            
            <div style="text-align:center; font-size:12px; font-weight:bold;">ضبط مكان الطباعة:</div>
            <div class="align-btn-group">
                <button class="align-btn" onclick="setAlignment('flex-start')">يسار</button>
                <button class="align-btn" onclick="setAlignment('center')">وسط</button>
                <button class="align-btn active" onclick="setAlignment('flex-end')">يمين</button>
            </div>
        </div>

        <button class="main-btn btn-save" onclick="saveImage()">💾 حفظ الصورة للطابعة</button>

        <div class="preview-area">
            <div id="paper-canvas">
                <div class="sticker-content">
                    <div class="shop-name">البحراني للهواتف</div>
                    <div class="top-number" id="fullNumTxt">1360123456</div>
                    <svg id="barcode"></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stream = null, isScanning = false, zxingReader = null;
        
        // --- التحكم بالمحاذاة ---
        function setAlignment(position) {
            document.getElementById('paper-canvas').style.justifyContent = position;
            // تحديث ستايل الأزرار
            document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        // --- التحديث ---
        function updateLabel() {
            // توليد رقم عشوائي إذا لم يوجد
            let currentNum = document.getElementById('fullNumTxt').innerText;
            if(!currentNum) currentNum = "1360" + Math.floor(100000 + Math.random() * 900000);
            
            let inputVal = document.getElementById('barcodeInput').value;
            let finalVal = inputVal ? inputVal : currentNum;
            
            document.getElementById('fullNumTxt').innerText = finalVal;

            try {
                JsBarcode("#barcode", finalVal, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 1.8,  // أنحف قليلاً ليناسب المساحة الصغيرة
                    height: 25,
                    displayValue: false,
                    margin: 0
                });
            } catch(e){}
        }

        // --- الكاميرا ---
        async function toggleCamera() {
            if (isScanning) { stopCamera(); return; }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('scanVideo').srcObject = stream;
                document.getElementById('camera-wrapper').style.display = 'block';
                isScanning = true;
                
                if(!zxingReader) zxingReader = new ZXing.BrowserMultiFormatReader();
                zxingReader.decodeFromVideoDevice(null, 'scanVideo', (res)=>{
                    if(res){
                         document.getElementById('barcodeInput').value = res.getText();
                         updateLabel();
                         stopCamera();
                    }
                });
            } catch (e) { alert("الكاميرا لا تعمل"); stopCamera(); }
        }

        function stopCamera() {
            isScanning = false;
            if(stream) stream.getTracks().forEach(t=>t.stop());
            document.getElementById('camera-wrapper').style.display = 'none';
        }

        // --- الحفظ ---
        function saveImage() {
            const el = document.getElementById("paper-canvas"); // نحفظ الورقة الكاملة 58مم
            
            // رفع الدقة للطباعة
            html2canvas(el, { scale: 5, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Print_58mm.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        window.onload = updateLabel;
    </script>
</body>
</html>
