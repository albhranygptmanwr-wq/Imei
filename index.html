<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الماسح المباشر السريع</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eee; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: #333; }
        .container { background: white; padding: 15px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h3 { text-align: center; margin: 0 0 15px 0; color: #2c3e50; }

        /* منطقة الكاميرا */
        #reader { width: 100%; border-radius: 10px; overflow: hidden; background: #000; margin-bottom: 15px; border: 4px solid #007bff; display: none; }
        
        .scan-btn {
            background-color: #dc3545; color: white; border: none; padding: 15px; 
            width: 100%; border-radius: 10px; font-size: 18px; font-weight: bold; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .scan-btn:active { transform: scale(0.98); }

        /* نصيحة التدوير */
        .tip-box {
            background-color: #fff3cd; color: #856404; padding: 10px; border-radius: 8px;
            font-size: 13px; text-align: center; margin-bottom: 15px; border: 1px solid #ffeeba;
            display: none; /* يظهر عند فتح الكاميرا */
        }

        /* الحقول */
        .input-group { margin-bottom: 12px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input.normal-input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; box-sizing: border-box; }

        /* الرقم الخاص */
        .smart-input-container { display: flex; align-items: center; border: 2px solid #007bff; border-radius: 8px; background-color: #f8f9fa; overflow: hidden; }
        .fixed-part { background-color: #007bff; color: white; padding: 12px; font-weight: bold; font-size: 16px; }
        .user-input { border: none; padding: 10px; font-size: 20px; width: 70px; text-align: center; font-weight: bold; outline: none; color: #d63384; }
        .random-part { flex-grow: 1; text-align: center; font-family: monospace; font-size: 18px; color: #555; letter-spacing: 2px; }
        .refresh-btn { border: none; background: none; font-size: 24px; cursor: pointer; padding: 0 15px; }

        /* الأزرار */
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-save { background-color: #28a745; }
        .btn-share { background-color: #007bff; }

        /* الملصق */
        .preview-area { margin-top: 25px; display: flex; justify-content: center; }
        #sticker-box { background-color: white; width: 320px; padding: 25px 15px; text-align: center; border: 1px solid #eee; display: flex; flex-direction: column; align-items: center; }
        .shop-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; font-family: Tahoma; }
        .top-number { font-size: 34px; font-weight: bold; margin-bottom: 10px; font-family: Arial; }
        svg#barcode { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h3>نظام الملصقات المباشر</h3>

        <button class="scan-btn" onclick="startCamera()">
            📷 اضغط هنا لمسح الباركود
        </button>

        <div id="reader"></div>
        
        <div id="tip-msg" class="tip-box">
            💡 <b>نصيحة ذهبية:</b><br>
            إذا كان الباركود في الشاشة "واقف" (عمودي)،<br>
            <b>اقلب جوالك أنت بالعرض</b> ليتم المسح فوراً! 🔄
        </div>

        <div class="input-group">
            <label>رقم الباركود (IMEI):</label>
            <input class="normal-input" type="text" id="barcodeInput" value="354645091451710" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>اسم المحل:</label>
            <input class="normal-input" type="text" id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>الرقم الخاص:</label>
            <div class="smart-input-container">
                <div class="fixed-part">13</div>
                <input type="number" id="userPart" class="user-input" placeholder="00" value="60" oninput="updateLabel()">
                <div class="random-part" id="randomDisplay">------</div>
                <button class="refresh-btn" onclick="generateNewRandom()">🔄</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-save" onclick="saveImage()">💾 حفظ الصورة</button>
            <button class="btn btn-share" onclick="shareImage()">📤 مشاركة</button>
        </div>

        <div class="preview-area">
            <div id="sticker-box">
                <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
                <div class="top-number" id="fullNumTxt">1360843635</div>
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <script>
        // --- 1. المنطق الأساسي (أرقام وملصقات) ---
        let currentRandom = "";
        function generateNewRandom() {
            currentRandom = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('randomDisplay').innerText = currentRandom;
            updateLabel();
        }

        function updateLabel() {
            document.getElementById('shopTxt').innerText = document.getElementById('shopInput').value;
            let userVal = document.getElementById('userPart').value;
            if(currentRandom === "") { generateNewRandom(); return; }
            document.getElementById('fullNumTxt').innerText = "13" + userVal + currentRandom;
            try {
                JsBarcode("#barcode", document.getElementById('barcodeInput').value, {
                    format: "CODE128", lineColor: "#000", width: 2.3, height: 60, displayValue: true, fontSize: 18, margin: 0
                });
            } catch (e) {}
        }

        // --- 2. الكاميرا المباشرة (مبسطة وقوية) ---
        let html5QrcodeScanner;

        function startCamera() {
            const readerDiv = document.getElementById('reader');
            const tipMsg = document.getElementById('tip-msg');

            // إذا كانت الكاميرا تعمل، نغلقها
            if (readerDiv.style.display === 'block') {
                if(html5QrcodeScanner) { html5QrcodeScanner.clear(); }
                readerDiv.style.display = 'none';
                tipMsg.style.display = 'none';
                return;
            }

            readerDiv.style.display = 'block';
            tipMsg.style.display = 'block'; // إظهار النصيحة

            // إعدادات الكاميرا
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 15, // سرعة مسح عالية
                    qrbox: { width: 250, height: 250 }, // مربع كبير لاستيعاب كل الزوايا
                    aspectRatio: 1.0,
                    // تفعيل الميزات التجريبية لاستخدام ماسح النظام القوي
                    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
                },
                /* verbose= */ false
            );

            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function onScanSuccess(decodedText, decodedResult) {
            // عند النجاح
            document.getElementById('barcodeInput').value = decodedText;
            updateLabel();
            
            // إغلاق الكاميرا وتنبيه المستخدم
            html5QrcodeScanner.clear().then(() => {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('tip-msg').style.display = 'none';
                // هزاز بسيط لتأكيد القراءة (على الأندرويد)
                if (navigator.vibrate) navigator.vibrate(200);
            });
        }

        function onScanFailure(error) {
            // تجاهل الأخطاء المتكررة أثناء البحث
        }

        // --- 3. الحفظ والمشاركة ---
        const captureOptions = { scale: 3, useCORS: true, backgroundColor: "#ffffff" };

        function saveImage() {
            const el = document.getElementById("sticker-box");
            const border = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                const link = document.createElement('a');
                link.download = `Label_${document.getElementById('userPart').value}.png`;
                link.href = canvas.toDataURL();
                link.click();
                el.style.border = border;
            });
        }

        function shareImage() {
            const el = document.getElementById("sticker-box");
            const border = el.style.border; el.style.border = "none";
            html2canvas(el, captureOptions).then(canvas => {
                canvas.toBlob(blob => {
                    if (navigator.share) {
                        navigator.share({ files: [new File([blob], "sticker.png", {type: "image/png"})], title: 'ملصق' });
                    } else { alert("المشاركة غير مدعومة"); }
                    el.style.border = border;
                });
            });
        }

        window.onload = generateNewRandom;
    </script>

</body>
</html>
