<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Label PDF – MS-B58A</title>

  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial;margin:16px;background:#0b0f14;color:#e8eef6}
    .card{background:#121a24;border:1px solid #223042;border-radius:14px;padding:14px;max-width:560px}
    label{display:block;margin:10px 0 6px;color:#bcd0ea;font-size:14px}
    input,button{
      width:100%;box-sizing:border-box;padding:12px;border-radius:12px;
      border:1px solid #2a3b52;background:#0f1620;color:#e8eef6;font-size:16px
    }
    button{cursor:pointer;background:#1d6cff;border:none;margin-top:10px}
    button.secondary{background:#2a3b52}
    .row{display:flex;gap:10px}
    .row>div{flex:1}
    .hint{font-size:13px;color:#9bb3d1;margin-top:10px;line-height:1.6}
    .ok{color:#6ee7a8}.err{color:#ff8a8a}
    #videoWrap{margin-top:10px;display:none}
    video{width:100%;border-radius:14px;border:1px solid #223042;background:#000}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#0f1620;border:1px solid #223042;margin-top:10px}
    .small{font-size:12px;opacity:.9}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
</head>

<body>
  <div class="card">
    <h2 style="margin:0 0 8px">Label PDF (MS-B58A)</h2>

    <label>IMEI</label>
    <input id="imei" inputmode="numeric" placeholder="اقرأ بالكيمرا أو اكتب" maxlength="20">

    <div class="row">
      <div><button id="btnScan" class="secondary">📷 تصوير وقراءة الباركود</button></div>
      <div><button id="btnStop" class="secondary" style="display:none">⛔ إيقاف</button></div>
    </div>

    <div id="videoWrap">
      <video id="video" playsinline muted></video>
      <div class="badge" id="scanStatus">جاهز…</div>
    </div>

    <label>السعر (رقمين فقط)</label>
    <input id="price" inputmode="numeric" maxlength="2">

    <!-- إضافة فقط -->
    <label>مقاس الليبل (PX)</label>
    <div class="row">
      <div><input id="w" value="375"></div>
      <div><input id="h" value="178"></div>
    </div>

    <button id="btnPdf">⬇️ تنزيل PDF</button>
    <div class="hint" id="msg"></div>
  </div>

<script>
  const $ = (id)=>document.getElementById(id);
  const msg = (t, ok=true)=>{ $("msg").innerHTML = `<span class="${ok?'ok':'err'}">${t}</span>`; };

  const PX_TO_PT = 0.75;

  function digitsOnly(v){ return String(v||"").replace(/\D+/g,''); }
  function cleanImei(v){ return digitsOnly(v).slice(0, 20); }

  function randomDigits(len){
    let s = "";
    for (let i=0;i<len;i++) s += Math.floor(Math.random()*10);
    return s;
  }

  function makePricingCode(priceRaw){
    const p = digitsOnly(priceRaw);
    if (p.length !== 2) return null;
    return "13" + p + randomDigits(6);
  }

  function makeBarcodePngDataUrl(imei){
    const c = document.createElement("canvas");
    JsBarcode(c, imei, { format:"CODE128", displayValue:false, margin:0, height:64 });
    return c.toDataURL("image/png");
  }

  /* ==== Scanner (تصليح فقط بدون تغيير منطقك) ==== */
  let quaggaRunning=false;

  function startScan(){
    $("videoWrap").style.display="block";
    $("btnStop").style.display="block";
    $("scanStatus").textContent="وجّه الكيمرا على الباركود…";

    Quagga.init({
      inputStream:{
        type:"LiveStream",
        target: $("video"),
        constraints:{ facingMode:"environment" }
      },
      decoder:{ readers:["code_128_reader"] },
      locate:true
    }, err=>{
      if(err){ msg("فشل تشغيل الكيمرا", false); return; }
      Quagga.start(); quaggaRunning=true;
    });

    Quagga.onDetected(data=>{
      const imei = cleanImei(data?.codeResult?.code);
      if(imei.length>=10){
        $("imei").value=imei;
        stopScan();
      }
    });
  }

  function stopScan(){
    if(quaggaRunning){ Quagga.stop(); quaggaRunning=false; }
    $("videoWrap").style.display="none";
    $("btnStop").style.display="none";
  }

  $("btnScan").onclick=()=>{ msg(""); startScan(); };
  $("btnStop").onclick=stopScan;

  /* ==== PDF ==== */
  $("btnPdf").onclick=()=>{
    const imei = cleanImei($("imei").value);
    const price = digitsOnly($("price").value);
    if(!imei || imei.length<10) return msg("دخل IMEI صحيح.", false);
    if(price.length!==2) return msg("السعر لازم رقمين.", false);

    const code = makePricingCode(price);

    const w = parseInt($("w").value)||375;
    const h = parseInt($("h").value)||178;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({
      unit:"pt",
      format:[w*PX_TO_PT, h*PX_TO_PT]
    });

    const pw=w*PX_TO_PT, ph=h*PX_TO_PT;

    doc.rect(1,1,pw-2,ph-2);

    doc.setFont("helvetica","bold");
    doc.setFontSize(18);
    doc.text("البحراني للهواتف الذكية", pw/2, 26, {align:"center"});

    doc.setFontSize(24);
    doc.text(code, pw/2, 48, {align:"center"});

    doc.addImage(makeBarcodePngDataUrl(imei),"PNG",10,60,pw-20,ph-92);

    doc.setFontSize(14);
    doc.text(imei, pw/2, ph-12, {align:"center"});

    doc.save(`Label_${imei}.pdf`);
    msg("✅ تم تنزيل PDF", true);
  };
</script>
</body>
</html>
