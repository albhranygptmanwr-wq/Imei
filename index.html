<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملصق باركود مرن – البحراني</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 16px;
  background: #f0f0f0;
}
.card {
  background: #fff;
  border: 1px solid #000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 4%;
  box-sizing: border-box;
  width: 384px;   /* الافتراضي */
  height: 128px;  /* الافتراضي */
}
.card .title {
  text-align: center;
  font-weight: bold;
  font-size: calc(10px + 1vw);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
}
.card .barcode {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card .barcode img {
  max-width: 90%;
  max-height: 100%;
  object-fit: contain;
  display: block;
}
.card .price {
  text-align: center;
  font-weight: bold;
  font-size: calc(8px + 0.8vw);
  line-height: 1.2;
}
input,button {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>إنشاء ملصق باركود مرن</h2>

<label>IMEI</label>
<input id="imei" placeholder="اكتب أو اقرأ بالكاميرا">

<label>السعر</label>
<input id="price" placeholder="مثال: 22 أو 150 أو 1200">

<label>عرض الملصق (px)</label>
<input id="w" value="384">

<label>ارتفاع الملصق (px)</label>
<input id="h" value="128">

<button id="btnGenerate">⬇️ تنزيل PDF</button>

<div class="card" id="preview">
  <div class="title">البحراني للهواتف الذكية</div>
  <div class="barcode">
    <img id="barcodeImg" src="">
  </div>
  <div class="price" id="pricePreview">السعر: 15000</div>
</div>

<script>
const $ = id=>document.getElementById(id);

/* ===== Barcode helper ===== */
function generateBarcode(imei){
  const canvas = document.createElement("canvas");
  JsBarcode(canvas, imei, {format:"CODE128", displayValue:false, height:64, margin:0});
  return canvas.toDataURL("image/png");
}

/* ===== Update preview ===== */
function updatePreview(){
  const imei = $.imei.value || "123456789012345";
  const price = $.price.value || "15000";
  const img = generateBarcode(imei);
  $.barcodeImg.src = img;
  $.pricePreview.textContent = "السعر: " + price;
  const w = parseInt($.w.value) || 384;
  const h = parseInt($.h.value) || 128;
  const card = $.preview;
  card.style.width = w + "px";
  card.style.height = h + "px";
}
$.imei.oninput = $.price.oninput = $.w.oninput = $.h.oninput = updatePreview;
updatePreview();

/* ===== Download PDF ===== */
$.btnGenerate.onclick = ()=>{
  const imei = $.imei.value.trim();
  const price = $.price.value.trim();
  if(!imei || !price){alert("ادخل IMEI والسعر"); return;}
  const w = parseInt($.w.value) || 384;
  const h = parseInt($.h.value) || 128;
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({
    orientation: w>=h?"landscape":"portrait",
    unit:"pt",
    format:[w*0.75,h*0.75]
  });

  // Border
  doc.setDrawColor(0); doc.setLineWidth(1);
  doc.rect(1,1,w*0.75-2,h*0.75-2);

  // اسم المحل (كصورة)
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = "bold 14px Tahoma";
  const text = "البحراني للهواتف الذكية";
  const textW = ctx.measureText(text).width + 20;
  const textH = 20;
  canvas.width = textW;
  canvas.height = textH;
  ctx.font = "bold 14px Tahoma";
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text,textW/2,textH/2);
  const shopImg = canvas.toDataURL("image/png");
  doc.addImage(shopImg,"PNG",(w*0.75 - textW)/2,8,textW,textH);

  // السعر
  doc.setFont("helvetica","bold");
  doc.setFontSize(12);
  doc.text("السعر: "+price,(w*0.75)/2,h*0.75 - 14,{align:"center"});

  // الباركود
  const bcImg = generateBarcode(imei);
  doc.addImage(bcImg,"PNG",10,32,w*0.75-20,h*0.75 - 32 - 28);

  doc.save(`Label_${imei}.pdf`);
};
</script>

</body>
</html>
