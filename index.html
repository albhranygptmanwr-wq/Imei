<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البحراني + طباعة 57مم</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        
        body {
            margin: 0; padding: 20px;
            background-color: #f0f2f5; 
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Cairo', sans-serif; color: #333;
        }

        .main-card {
            background-color: #fff; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); padding: 25px;
            width: 100%; max-width: 420px; overflow: hidden;
        }

        h2.app-title { text-align: center; color: #1a73e8; margin: 0 0 25px 0; font-weight: 700; }

        /* === الكاميرا === */
        #camera-wrapper {
            position: relative; width: 100%; height: 260px;
            background: #000; border-radius: 12px; overflow: hidden;
            margin-bottom: 10px; display: none; border: 3px solid #1a73e8;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 100px; border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 8px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); z-index: 10;
        }
        .scan-line {
            width: 100%; height: 2px; background: #ffc107; position: absolute; top: 0;
            box-shadow: 0 0 4px #ffc107; animation: scanAnim 2s infinite linear;
        }
        @keyframes scanAnim { 0% {top: 0;} 50% {top: 100%;} 100% {top: 0;} }

        /* التحكم بالكاميرا */
        .cam-controls-bar {
            display: none; align-items: center; justify-content: space-between; gap: 10px;
            background: #e8f0fe; padding: 10px; border-radius: 10px; margin-bottom: 15px;
        }
        .flash-btn {
            background: white; border: 1px solid #1a73e8; color: #1a73e8;
            width: 45px; height: 45px; border-radius: 50%; font-size: 20px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .flash-btn.active { background: #ffc107; border-color: #ffc107; color: #000; }
        .zoom-container { flex: 1; display: flex; align-items: center; gap: 5px; }
        input[type=range] { width: 100%; accent-color: #1a73e8; }
        
        .toggle-cam-btn {
            width: 100%; padding: 14px; background-color: #1a73e8; color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .toggle-cam-btn.stop { background-color: #dc3545; }

        /* المدخلات */
        .section-title { font-size: 15px; font-weight: 600; color: #5f6368; margin-bottom: 10px; }
        .input-row-styled { display: flex; align-items: stretch; background: white; border: 2px solid #e0e0e0; border-radius: 8px; overflow: hidden; margin-bottom: 20px;}
        .fixed-prefix-styled { background-color: #e8f0fe; color: #1a73e8; padding: 12px 15px; font-weight: 700; font-family: Arial; display: flex; align-items: center; border-left: 1px solid #e0e0e0; }
        .styled-input { flex: 1; border: none; padding: 12px; font-size: 18px; font-family: Arial; text-align: center; font-weight: bold; outline: none; }
        .refresh-btn-styled { background-color: #fff3cd; color: #856404; border: none; padding: 0 15px; cursor: pointer; font-size: 20px; border-right: 1px solid #e0e0e0; }
        .barcode-input-styled { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; text-align: center; font-size: 16px; font-family: Arial; font-weight: bold; outline: none; }

        /* المعاينة (مضبوطة على 57مم) */
        .preview-container { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: center; margin-top: 20px; margin-bottom: 20px; }
        .printer-head { 
            background-color: #e8d880; 
            width: 384px; /* هذا هو العرض السحري لورق 57مم */ 
            height: auto; 
            display: flex; flex-direction: column; align-items: flex-start; 
            padding-bottom: 10px; overflow: hidden; margin: 0 auto; 
            border-radius: 8px; border: 3px solid #e8d880; 
        }
        .top-spacer { width: 100%; height: 25px; flex-shrink: 0; }
        .white-label { background-color: white; width: 275px; margin-right: 0px; border-radius: 4px; padding: 5px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .shop-name { font-size: 19px; font-weight: 900; color: #000; margin-bottom: 8px; line-height: 1.1; white-space: nowrap; }
        .big-number { font-size: 27px; font-weight: 900; font-family: Arial; border-bottom: 3px solid black; padding-bottom: 2px; display: inline-block; margin-bottom: 5px; line-height: 1; letter-spacing: 0.5px; }
        #barcode { width: 98% !important; height: auto; }

        /* البلوتوث */
        .bt-section { background: #e3f2fd; border: 2px dashed #1a73e8; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 15px; }
        .bt-status { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 10px; }
        .bt-status.connected { color: #28a745; }
        .btn-bt { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 5px; }
        .btn-connect { background-color: #1a73e8; color: white; }
        .btn-print-direct { background-color: #6f42c1; color: white; opacity: 0.5; pointer-events: none; }
        .btn-print-direct.ready { opacity: 1; pointer-events: all; }
        
        .actions-row { display: flex; gap: 10px; border-top: 1px solid #eee; padding-top: 15px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; color: white; }
        .btn-share { background: #28a745; }
        .btn-download { background: #6c757d; }

    </style>
</head>
<body>

    <div class="main-card">
        <h2 class="app-title">نظام البحراني المتكامل 🌟</h2>

        <div class="section-title">🔢 الرقم الخاص:</div>
        <div class="input-row-styled">
            <div class="fixed-prefix-styled">13</div>
            <input type="text" id="userInputPart" class="styled-input" placeholder="اكتب رقمين.." maxlength="8" oninput="generateRandomNumber()">
            <button class="refresh-btn-styled" onclick="generateRandomNumber()">🎲</button>
        </div>

        <div class="section-title">📸 الماسح الضوئي:</div>
        <div id="camera-wrapper"><video id="scanVideo" playsinline muted autoplay></video><div class="scan-overlay"><div class="scan-line"></div></div></div>
        <div class="cam-controls-bar" id="camControls">
            <button class="flash-btn" id="flashBtn" onclick="toggleFlash()">⚡</button>
            <div class="zoom-container"><span style="font-size:12px">➖</span><input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" oninput="applyZoom(this.value)"><span style="font-size:12px">➕</span></div>
        </div>
        <button class="toggle-cam-btn" id="camToggleBtn" onclick="toggleCamera()">📷 فتح الكاميرا</button>
        <input type="text" id="imeiInput" class="barcode-input-styled" value="354645091451710" oninput="updateBarcodeOnly()" placeholder="أو اكتب الباركود يدوياً...">

        <div class="preview-container">
            <div id="capture-area" class="printer-head">
                <div class="top-spacer"></div>
                <div class="white-label">
                    <div class="shop-name">البحراني للهواتف الذكية</div>
                    <div class="big-number" id="displayTopNum">1300000000</div>
                    <svg id="barcode"></svg>
                </div>
            </div>
        </div>

        <div class="bt-section">
            <div id="btStatus" class="bt-status">🔴 الطابعة غير متصلة</div>
            <button class="btn-bt btn-connect" onclick="connectToPrinter()">🔗 بحث عن طابعة</button>
            <button id="printBtn" class="btn-bt btn-print-direct" onclick="printDirectly()">🖨️ طباعة فورية (57mm)</button>
        </div>

        <div class="actions-row">
            <button class="btn-action btn-share" onclick="shareImage()">📤 مشاركة</button>
            <button class="btn-action btn-download" onclick="downloadImage()">⬇️ تنزيل</button>
        </div>
    </div>

<script>
    // === دوال النظام الأساسية ===
    const PREFIX = "13"; const TARGET_LENGTH = 10;
    function generateRandomNumber() {
        let userPart = document.getElementById('userInputPart').value.replace(/[^0-9]/g, '');
        let needed = TARGET_LENGTH - (PREFIX.length + userPart.length);
        let randomPart = ""; if (needed > 0) { for (let i = 0; i < needed; i++) randomPart += Math.floor(Math.random() * 10); }
        let finalNumber = (PREFIX + userPart + randomPart).substring(0, TARGET_LENGTH);
        document.getElementById('displayTopNum').innerText = finalNumber;
    }
    function updateBarcodeOnly() {
        var imei = document.getElementById('imeiInput').value;
        if(imei) { try { JsBarcode("#barcode", imei, { format: "CODE128", lineColor: "#000", width: 1.7, height: 55, displayValue: true, fontSize: 16, fontOptions: "bold", margin: 2 }); } catch(e) {} }
    }

    // === الكاميرا ===
    let stream = null; let isScanning = false; let videoTrack = null;
    const videoEl = document.getElementById('scanVideo'); const wrapper = document.getElementById('camera-wrapper');
    const controls = document.getElementById('camControls'); const toggleBtn = document.getElementById('camToggleBtn');

    async function toggleCamera() {
        if (isScanning) { stopCamera(); return; }
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
            videoEl.srcObject = stream; videoTrack = stream.getVideoTracks()[0];
            wrapper.style.display = 'block'; controls.style.display = 'flex'; toggleBtn.innerText = "❌ إغلاق الكاميرا"; toggleBtn.classList.add('stop'); isScanning = true;
            if ("BarcodeDetector" in window) {
                const detector = new BarcodeDetector({ formats: ["code_128", "ean_13", "qr_code"] });
                const tick = async () => { if (!isScanning) return; try { const codes = await detector.detect(videoEl); if (codes.length) handleSuccess(codes[0].rawValue); } catch (e) {} requestAnimationFrame(tick); }; tick();
            } else {
                const reader = new ZXing.BrowserMultiFormatReader(); reader.decodeFromVideoDevice(null, videoEl, (result) => { if (result) handleSuccess(result.getText()); });
            }
        } catch (e) { alert("الكاميرا غير متاحة"); stopCamera(); }
    }
    function stopCamera() { isScanning = false; if(stream) { stream.getTracks().forEach(t => t.stop()); stream = null; videoTrack = null; } wrapper.style.display = 'none'; controls.style.display = 'none'; toggleBtn.innerText = "📷 فتح الكاميرا"; toggleBtn.classList.remove('stop'); document.getElementById('flashBtn').classList.remove('active'); }
    function handleSuccess(val) { if (navigator.vibrate) navigator.vibrate(200); document.getElementById('imeiInput').value = val.replace(/[^0-9]/g, ''); updateBarcodeOnly(); stopCamera(); }
    async function toggleFlash() { if (!videoTrack) return; const btn = document.getElementById('flashBtn'); try { let mode = !btn.classList.contains('active'); await videoTrack.applyConstraints({ advanced: [{ torch: mode }] }); btn.classList.toggle('active'); } catch (e) {} }
    async function applyZoom(val) { if (!videoTrack) return; try { await videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }); } catch (e) {} }

    // ===========================================
    // === 🔥 نظام الطباعة 57مم المطور 🔥 ===
    // ===========================================
    let printCharacteristic = null; let printerDevice = null;
    const PRINTER_WIDTH_PX = 384; // عرض 57مم بالبكسل

    async function connectToPrinter() {
        try {
            document.getElementById('btStatus').innerText = "🟡 جاري البحث...";
            printerDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: ['000018f0-0000-1000-8000-00805f9b34fb'] }],
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'], acceptAllDevices: false 
            }).catch(async (e) => { return await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] }); });
            
            const server = await printerDevice.gatt.connect();
            const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
            printCharacteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
            
            document.getElementById('btStatus').innerHTML = `🟢 متصل بـ: ${printerDevice.name}`;
            document.getElementById('btStatus').classList.add('connected');
            document.getElementById('printBtn').classList.add('ready');
            printerDevice.addEventListener('gattserverdisconnected', onDisconnected);
        } catch (error) { document.getElementById('btStatus').innerText = "🔴 فشل الاتصال"; alert("تأكد أن الطابعة تعمل والبلوتوث مفعل"); }
    }
    function onDisconnected() { document.getElementById('btStatus').innerText = "🔴 تم قطع الاتصال"; document.getElementById('btStatus').classList.remove('connected'); document.getElementById('printBtn').classList.remove('ready'); }

    async function printDirectly() {
        if (!printCharacteristic) { alert("اتصل بالطابعة أولاً"); return; }
        
        // 1. التقاط الصورة بدقة عالية
        const capturedCanvas = await html2canvas(document.getElementById("capture-area"), { scale: 2, useCORS: true });
        
        // 2. تغيير حجم الصورة لتكون 384 بكسل بالضبط (عرض 57مم)
        // هذا هو الجزء الذي يصلح مشكلة "الخربشة"
        const resizedCanvas = document.createElement('canvas');
        const scaleFactor = PRINTER_WIDTH_PX / capturedCanvas.width;
        resizedCanvas.width = PRINTER_WIDTH_PX;
        resizedCanvas.height = capturedCanvas.height * scaleFactor;
        
        const ctx = resizedCanvas.getContext('2d');
        ctx.drawImage(capturedCanvas, 0, 0, resizedCanvas.width, resizedCanvas.height);

        // 3. تحويل وإرسال
        const printData = getImagePrintData(resizedCanvas);
        await sendDataToPrinter(printData);
    }

    function getImagePrintData(canvas) {
        const ctx = canvas.getContext('2d'); const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const width = canvas.width; const height = canvas.height;
        
        // أوامر تهيئة الطابعة (ESC/POS)
        let commands = [
            0x1B, 0x40, // تهيئة
            0x1D, 0x76, 0x30, 0x00 // أمر طباعة صورة (GS v 0)
        ];
        
        // إرسال الأبعاد (Width bytes, Height dots)
        // العرض بالبايت = 384 / 8 = 48 بايت
        const xL = (width / 8) % 256; const xH = Math.floor((width / 8) / 256);
        const yL = height % 256; const yH = Math.floor(height / 256);
        commands.push(xL, xH, yL, yH);
        
        let byte = 0; let bitCount = 0;
        
        // تحويل البكسلات إلى أبيض وأسود (Binary)
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const offset = (y * width + x) * 4;
                const r = imgData.data[offset];
                const g = imgData.data[offset + 1];
                const b = imgData.data[offset + 2];
                
                // عتبة التحويل (Threshold)
                const brightness = (r + g + b) / 3;
                // إذا كان غامق (أقل من 128) نعتبره نقطة سوداء (1)
                const bit = brightness < 128 ? 1 : 0; 
                
                byte |= (bit << (7 - bitCount)); 
                bitCount++;
                
                if (bitCount === 8) { commands.push(byte); byte = 0; bitCount = 0; }
            }
        }
        
        // أوامر قص / تغذية
        commands.push(0x1B, 0x64, 0x03); 
        return new Uint8Array(commands);
    }

    async function sendDataToPrinter(data) { 
        // إرسال البيانات مجزأة لتجنب امتلاء ذاكرة الطابعة
        const CHUNK_SIZE = 100; 
        for (let i = 0; i < data.length; i += CHUNK_SIZE) { 
            await printCharacteristic.writeValue(data.slice(i, i + CHUNK_SIZE)); 
            // تأخير بسيط جداً لضمان استقرار البلوتوث
            await new Promise(r => setTimeout(r, 10)); 
        } 
    }

    function shareImage() { html2canvas(document.getElementById("capture-area"), {scale:3}).then(c => { c.toBlob(b => { navigator.share ? navigator.share({files:[new File([b],"label.png",{type:"image/png"})]}) : downloadImage(); }) }); }
    function downloadImage() { html2canvas(document.getElementById("capture-area"), {scale:3}).then(c => { const a = document.createElement('a'); a.download='label.png'; a.href=c.toDataURL(); a.click(); }); }

    generateRandomNumber(); updateBarcodeOnly();
</script>
</body>
</html>
