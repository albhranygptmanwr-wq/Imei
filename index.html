<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ IMEI الاحترافي</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            color: #333;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h3 { text-align: center; margin-top: 0; color: #2c3e50; }

        /* منطقة الكاميرا المخصصة */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: none; /* مخفي افتراضياً */
            background: #000;
            margin-bottom: 15px;
        }

        .input-group { margin-bottom: 15px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 14px; color: #555; }

        /* أزرار التحكم في المسح */
        .scan-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .scan-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.2s;
        }
        .btn-cam { background-color: #dc3545; color: white; } /* أحمر للكاميرا */
        .btn-file { background-color: #6c757d; color: white; } /* رمادي للملف */
        
        .scan-btn:active { transform: scale(0.98); }

        /* الحقل المركب */
        .smart-input-container {
            display: flex;
            align-items: center;
            border: 2px solid #007bff;
            border-radius: 8px;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .fixed-part {
            background-color: #007bff;
            color: white;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
        }
        .user-input {
            border: none;
            padding: 10px 5px;
            font-size: 18px;
            width: 60px;
            text-align: center;
            font-weight: bold;
            outline: none;
            background: #fff;
            color: #d63384;
        }
        .random-part {
            background-color: #e9ecef;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            color: #666;
            flex-grow: 1;
            text-align: center;
            border-left: 1px solid #ddd;
        }
        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 0 10px;
        }

        /* الحقول العادية */
        input.normal-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* أزرار الحفظ */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button.action-btn {
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-save { background-color: #28a745; }
        .btn-share { background-color: #007bff; }

        /* المعاينة */
        .preview-area {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }
        #sticker-box {
            background-color: white;
            width: 320px;
            padding: 25px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
        }
        .shop-name {
            font-family: 'Tahoma', sans-serif;
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-bottom: 5px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .top-number {
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: bold;
            color: #000;
            margin: 5px 0 10px 0;
            letter-spacing: 1px;
        }
        svg#barcode { width: 100%; height: auto; display: block; }
        
        /* رسالة الحالة */
        #status-msg {
            text-align: center;
            font-size: 12px;
            margin-bottom: 10px;
            color: #dc3545;
            min-height: 18px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h3>نظام الملصقات الذكي</h3>

        <div id="reader"></div>
        <div id="status-msg"></div>

        <div class="scan-controls">
            <button class="scan-btn btn-cam" onclick="startCamera()">📷 مسح مباشر</button>
            <button class="scan-btn btn-file" onclick="document.getElementById('file-input').click()">📁 من صورة</button>
            <input type="file" id="file-input" accept="image/*" style="display: none" onchange="scanFromFile(this)">
        </div>

        <div class="input-group">
            <label>رقم الباركود (IMEI):</label>
            <input class="normal-input" type="text" id="barcodeInput" value="354645091451710" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>اسم المحل:</label>
            <input class="normal-input" type="text" id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>الرقم الخاص:</label>
            <div class="smart-input-container">
                <div class="fixed-part">13</div>
                <input type="number" id="userPart" class="user-input" placeholder="00" value="60" oninput="updateLabel()">
                <div class="random-part" id="randomDisplay">------</div>
                <button class="refresh-btn" onclick="generateNewRandom()">🔄</button>
            </div>
        </div>

        <div class="btn-group">
            <button class="action-btn btn-save" onclick="saveImage()">💾 حفظ</button>
            <button class="action-btn btn-share" onclick="shareImage()">📤 مشاركة</button>
        </div>

        <div class="preview-area">
            <div id="sticker-box">
                <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
                <div class="top-number" id="fullNumTxt">1360843635</div>
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <script>
        // 1. إعدادات الباركود والملصق
        let currentRandom = "";
        function generateNewRandom() {
            currentRandom = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('randomDisplay').innerText = currentRandom;
            updateLabel();
        }

        function updateLabel() {
            document.getElementById('shopTxt').innerText = document.getElementById('shopInput').value;
            let userVal = document.getElementById('userPart').value;
            if(currentRandom === "") { generateNewRandom(); return; }
            let fullNumber = "13" + userVal + currentRandom;
            document.getElementById('fullNumTxt').innerText = fullNumber;
            
            try {
                JsBarcode("#barcode", document.getElementById('barcodeInput').value, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 2.3,
                    height: 60,
                    displayValue: true,
                    fontSize: 18,
                    margin: 0
                });
            } catch (e) {}
        }

        // 2. إعدادات القارئ (الجزء المهم جداً)
        let html5QrCode;
        
        // حصر الأنواع المدعومة بـ Code 128 (IMEI) فقط لتسريع القراءة ومنع الخطأ
        const formats = [ 
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39 
        ];

        // --- أ) تشغيل الكاميرا المباشرة ---
        function startCamera() {
            const readerDiv = document.getElementById('reader');
            const statusMsg = document.getElementById('status-msg');

            // إذا كانت الكاميرا تعمل، نغلقها
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = "none";
                    html5QrCode.clear();
                    statusMsg.innerText = "";
                });
                return;
            }

            readerDiv.style.display = "block";
            statusMsg.innerText = "جاري تشغيل الكاميرا...";

            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 15, 
                qrbox: { width: 300, height: 100 }, // صندوق عريض
                aspectRatio: 1.0,
                formatsToSupport: formats, // البحث عن IMEI فقط
                experimentalFeatures: { useBarCodeDetectorIfSupported: true } // استخدام قارئ النظام
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    // عند النجاح
                    document.getElementById('barcodeInput').value = decodedText;
                    updateLabel();
                    statusMsg.innerText = "✅ تم القراءة بنجاح!";
                    // إغلاق الكاميرا تلقائياً
                    html5QrCode.stop().then(() => {
                        readerDiv.style.display = "none";
                        html5QrCode.clear();
                    });
                },
                (errorMessage) => {
                    // نتجاهل أخطاء البحث المستمر
                }
            ).catch(err => {
                statusMsg.innerText = "خطأ في الكاميرا: " + err;
            });
        }

        // --- ب) المسح من ملف صورة ---
        function scanFromFile(input) {
            if (input.files.length === 0) return;
            
            const imageFile = input.files[0];
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = "جاري تحليل الصورة...";

            const html5QrCodeFile = new Html5Qrcode("reader");

            html5QrCodeFile.scanFileV2(imageFile, true)
            .then(decodedResult => {
                // نجاح
                document.getElementById('barcodeInput').value = decodedResult.decodedText;
                updateLabel();
                statusMsg.innerText = "✅ تم استخراج الرقم من الصورة!";
            })
            .catch(err => {
                // فشل
                console.log(err);
                statusMsg.innerText = "❌ لم يتم العثور على باركود واضح. جرب الكاميرا المباشرة.";
            });
        }

        // 3. الحفظ والمشاركة
        const captureOptions = { scale: 3, useCORS: true, backgroundColor: "#ffffff" };

        function saveImage() {
            const element = document.getElementById("sticker-box");
            const originalBorder = element.style.border;
            element.style.border = "none";
            html2canvas(element, captureOptions).then(canvas => {
                const userVal = document.getElementById('userPart').value;
                const link = document.createElement('a');
                link.download = `Label_${userVal}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                element.style.border = originalBorder;
            });
        }

        function shareImage() {
            const element = document.getElementById("sticker-box");
            const originalBorder = element.style.border;
            element.style.border = "none";
            html2canvas(element, captureOptions).then(canvas => {
                canvas.toBlob(blob => {
                    if (navigator.share) {
                        const file = new File([blob], "sticker.png", { type: "image/png" });
                        navigator.share({ files: [file], title: 'ملصق البحراني' }).catch(console.error);
                    } else {
                        alert("المشاركة غير مدعومة");
                    }
                    element.style.border = originalBorder;
                });
            });
        }

        window.onload = function() {
            generateNewRandom();
        };
    </script>

</body>
</html>
