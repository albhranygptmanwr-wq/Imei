<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الملصقات الحرارية</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #222; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; color: #333; }
        .container { background: white; padding: 15px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h3 { text-align: center; margin: 0 0 15px 0; color: #2c3e50; }

        /* --- منطقة الكاميرا --- */
        #camera-wrapper {
            position: relative; width: 100%; height: 250px; background: #000;
            border-radius: 12px; overflow: hidden; margin-bottom: 10px; display: none;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; height: 80px; border: 2px solid rgba(255, 0, 0, 0.8);
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); border-radius: 6px; z-index: 10;
        }
        .scan-line {
            width: 100%; height: 2px; background: red; position: absolute; top: 0;
            animation: scanAnim 2s infinite linear;
        }
        @keyframes scanAnim { 0% {top: 0;} 50% {top: 100%;} 100% {top: 0;} }

        /* --- الأزرار والمدخلات --- */
        .camera-controls { display: flex; gap: 10px; justify-content: center; background: #f8f9fa; padding: 8px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .icon-btn { background: white; border: 1px solid #ccc; border-radius: 50%; width: 35px; height: 35px; font-size: 18px; cursor: pointer; }
        .icon-btn.active { background-color: #ffc107; border-color: #ffc107; }
        
        .main-scan-btn {
            width: 100%; padding: 12px; background-color: #dc3545; color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .input-group { margin-bottom: 10px; text-align: right; }
        label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 13px; }
        input.normal-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold; box-sizing: border-box; }
        input.normal-input.success { border-color: #28a745; background-color: #e8f5e9; color: #155724; }

        .smart-input-container { display: flex; align-items: center; border: 2px solid #007bff; border-radius: 8px; background-color: #f8f9fa; overflow: hidden; }
        .fixed-part { background-color: #007bff; color: white; padding: 10px; font-weight: bold; }
        .user-input { border: none; padding: 8px; font-size: 18px; width: 60px; text-align: center; font-weight: bold; outline: none; color: #d63384; }
        .random-part { flex-grow: 1; text-align: center; font-family: monospace; font-size: 18px; color: #555; }
        .refresh-btn { border: none; background: none; font-size: 20px; cursor: pointer; padding: 0 10px; }

        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn-save { background-color: #28a745; }
        .btn-share { background-color: #007bff; }

        /* --- تصميم الملصق للطابعة الحرارية --- */
        .preview-area { 
            margin-top: 20px; 
            padding: 20px; 
            background: #eee; 
            border-radius: 10px;
            display: flex; justify-content: center; 
        }

        #sticker-box { 
            /* أبعاد محددة تحاكي نسبة الملصق الحراري */
            background-color: white; 
            width: 300px;  
            /* ارتفاع تقريبي للملصق */
            min-height: 200px;
            padding: 10px 5px; 
            text-align: center; 
            /* لا حدود للملصق نفسه عند الطباعة */
            border: 1px dashed #ccc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        .shop-name { 
            font-size: 18px; 
            font-weight: 800; /* خط سميك جداً للطباعة الحرارية */
            margin-bottom: 5px; 
            white-space: nowrap; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #000;
        }

        .top-number { 
            font-size: 38px; /* رقم ضخم وواضح */
            font-weight: 900; 
            margin: 5px 0; 
            font-family: Arial, sans-serif;
            color: #000;
            letter-spacing: 2px;
            line-height: 1;
        }

        svg#barcode { 
            width: 90%; 
            height: auto; 
            display: block; 
            margin-top: 5px; 
            max-height: 70px; /* لضمان عدم خروجه عن الملصق */
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>نظام الملصقات الحرارية</h3>
        
        <div id="camera-wrapper">
            <video id="scanVideo" playsinline muted autoplay></video>
            <div class="scan-overlay"><div class="scan-line"></div></div>
        </div>

        <div class="camera-controls" id="cam-tools">
            <button class="icon-btn" id="flashBtn" onclick="toggleFlash()">⚡</button>
        </div>

        <button class="main-scan-btn" id="toggleBtn" onclick="toggleCamera()">
            📷 تشغيل الكاميرا
        </button>

        <div class="input-group">
            <label>الباركود الممسوح:</label>
            <input class="normal-input" type="text" id="barcodeInput" placeholder="امسح منتجاً..." 
                   oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>العنوان (أعلى الملصق):</label>
            <input class="normal-input" type="text" id="shopInput" value="البحراني للهواتف الذكية" oninput="updateLabel()">
        </div>

        <div class="input-group">
            <label>الرقم المولد (للطباعة):</label>
            <div class="smart-input-container">
                <div class="fixed-part">13</div>
                <input type="number" id="userPart" class="user-input" placeholder="00" value="60" oninput="updateLabel()">
                <div class="random-part" id="randomDisplay">------</div>
                <button class="refresh-btn" onclick="generateNewRandom()">🔄</button>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-save" onclick="saveImage()">💾 حفظ للطباعة</button>
            <button class="btn btn-share" onclick="shareImage()">📤 مشاركة</button>
        </div>

        <div class="preview-area">
            <div id="sticker-box">
                <div class="shop-name" id="shopTxt">البحراني للهواتف الذكية</div>
                <div class="top-number" id="fullNumTxt">1360123456</div>
                <svg id="barcode"></svg>
            </div>
        </div>
    </div>

    <script>
        // --- دوال الكاميرا والماسح ---
        let stream = null;
        let isScanning = false;
        let videoTrack = null;
        let zxingReader = null;
        
        const videoEl = document.getElementById('scanVideo');
        const wrapper = document.getElementById('camera-wrapper');
        const controls = document.getElementById('cam-tools');
        const btn = document.getElementById('toggleBtn');
        const inputEl = document.getElementById('barcodeInput');

        function beep(){
            try{
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
                g.gain.value = 0.04; o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 120);
            }catch(_){}
        }

        async function toggleCamera() {
            if (isScanning) { stopCamera(); return; }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } } });
                videoEl.srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                wrapper.style.display = 'block'; controls.style.display = 'flex';
                btn.innerText = "❌ إغلاق الكاميرا"; btn.style.backgroundColor = "#333";
                isScanning = true;

                if ("BarcodeDetector" in window) {
                    const detector = new BarcodeDetector({ formats: ["code_128", "ean_13", "qr_code"] });
                    const tick = async () => {
                        if (!isScanning) return;
                        try {
                            const codes = await detector.detect(videoEl);
                            if (codes.length) { handleSuccess(codes[0].rawValue); return; }
                        } catch (e) {}
                        requestAnimationFrame(tick);
                    }; tick();
                } else if (window.ZXing) {
                    zxingReader = new ZXing.BrowserMultiFormatReader();
                    zxingReader.decodeFromVideoDevice(null, videoEl, (result) => {
                        if (result) handleSuccess(result.getText());
                    });
                }
            } catch (e) { alert("خطأ بالكاميرا: " + e.message); stopCamera(); }
        }

        async function stopCamera() {
            isScanning = false;
            if (zxingReader) { zxingReader.reset(); zxingReader = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; videoTrack = null; }
            videoEl.srcObject = null; wrapper.style.display = 'none'; controls.style.display = 'none';
            btn.innerText = "📷 تشغيل الكاميرا"; btn.style.backgroundColor = "#dc3545";
        }

        function handleSuccess(val) {
            inputEl.value = val;
            inputEl.classList.add('success');
            updateLabel(); // تحديث الملصق فور المسح
            beep();
            if (navigator.vibrate) navigator.vibrate(100);
            stopCamera();
        }

        async function toggleFlash() {
            if (!videoTrack) return;
            const b = document.getElementById('flashBtn');
            try {
                await videoTrack.applyConstraints({ advanced: [{ torch: !b.classList.contains('active') }] });
                b.classList.toggle('active');
            } catch (e) {}
        }

        // --- دوال الملصق والباركود ---
        let currentRandom = "";
        
        function generateNewRandom() {
            currentRandom = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('randomDisplay').innerText = currentRandom;
            updateLabel();
        }

        function updateLabel() {
            // 1. تحديث اسم المحل
            document.getElementById('shopTxt').innerText = document.getElementById('shopInput').value;
            
            // 2. تجهيز الرقم الكامل
            let userVal = document.getElementById('userPart').value;
            if(currentRandom === "") { generateNewRandom(); return; }
            let generatedNum = "13" + userVal + currentRandom;
            
            // تحديث الرقم الكبير في الوسط
            document.getElementById('fullNumTxt').innerText = generatedNum;
            
            // 3. تحديد قيمة الباركود (من المسح أو من الرقم المولد)
            let scannedVal = document.getElementById('barcodeInput').value;
            let valueToEncode = scannedVal.length > 0 ? scannedVal : generatedNum;
            
            let barcodeSvg = document.getElementById('barcode');

            if (valueToEncode) {
                barcodeSvg.style.display = "block";
                try {
                    JsBarcode("#barcode", valueToEncode, {
                        format: "CODE128",
                        lineColor: "#000",
                        width: 3,           // خطوط عريضة للطابعة الحرارية
                        height: 50,         // ارتفاع مناسب
                        displayValue: false, // لا تظهر الرقم الصغير داخل الباركود (لأننا وضعنا الكبير فوقه)
                        margin: 0
                    });
                } catch (e) { barcodeSvg.style.display = "none"; }
            } else { barcodeSvg.style.display = "none"; }
        }

        // إعدادات الحفظ بدقة عالية للطابعة
        const captureOptions = { scale: 4, useCORS: true, backgroundColor: "#ffffff" };

        function saveImage() {
            const el = document.getElementById("sticker-box");
            // إزالة الحدود الوهمية قبل الحفظ لتكون الصورة نظيفة
            const oldBorder = el.style.border;
            el.style.border = "none";

            html2canvas(el, captureOptions).then(canvas => {
                const link = document.createElement('a');
                let fileName = document.getElementById('fullNumTxt').innerText;
                link.download = `Sticker_${fileName}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                el.style.border = oldBorder; // إرجاع الحدود للمعانية
            });
        }

        function shareImage() {
            const el = document.getElementById("sticker-box");
            const oldBorder = el.style.border;
            el.style.border = "none";

            html2canvas(el, captureOptions).then(canvas => {
                canvas.toBlob(blob => {
                    if (navigator.share) {
                        let fileName = document.getElementById('fullNumTxt').innerText;
                        navigator.share({ 
                            files: [new File([blob], `Sticker_${fileName}.png`, {type: "image/png"})], 
                            title: 'ملصق' 
                        });
                    } else { alert("المشاركة غير مدعومة في هذا المتصفح"); }
                    el.style.border = oldBorder;
                });
            });
        }

        window.onload = generateNewRandom;
    </script>
</body>
</html>
