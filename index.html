<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Label PDF – MS-B58A</title>

<style>
body{font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial;margin:16px;background:#0b0f14;color:#e8eef6}
.card{background:#121a24;border:1px solid #223042;border-radius:14px;padding:14px;max-width:560px}
label{display:block;margin:10px 0 6px;color:#bcd0ea;font-size:14px}
input,button{
  width:100%;box-sizing:border-box;padding:12px;border-radius:12px;
  border:1px solid #2a3b52;background:#0f1620;color:#e8eef6;font-size:16px
}
button{cursor:pointer;background:#1d6cff;border:none;margin-top:10px}
button.secondary{background:#2a3b52}
.row{display:flex;gap:10px}
.row>div{flex:1}
.hint{font-size:13px;color:#9bb3d1;margin-top:10px}
.ok{color:#6ee7a8}.err{color:#ff8a8a}
#videoWrap{margin-top:10px;display:none}
video{width:100%;border-radius:14px;border:1px solid #223042;background:#000}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#0f1620;border:1px solid #223042;margin-top:10px}
</style>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

<body>
<div class="card">
<h2>Label PDF (MS-B58A)</h2>

<label>IMEI</label>
<input id="imei" inputmode="numeric" placeholder="اقرأ بالكاميرا أو اكتب">

<div class="row">
  <div><button id="btnScan" class="secondary">📷 قراءة بالكاميرا</button></div>
  <div><button id="btnStop" class="secondary" style="display:none">⛔ إيقاف</button></div>
</div>

<div id="videoWrap">
  <video id="video" playsinline muted></video>
  <div class="badge" id="scanStatus">جاهز…</div>
</div>

<label>السعر</label>
<input id="price" inputmode="numeric" placeholder="مثال: 22 أو 150 أو 1200">

<label>مقاس الليبل (PX)</label>
<div class="row">
  <div><input id="w" value="384"></div>
  <div><input id="h" value="192"></div>
</div>

<button id="btnPdf">⬇️ تنزيل PDF</button>
<div class="hint" id="msg"></div>
</div>

<script>
const $ = id=>document.getElementById(id);
const msg = (t,ok=true)=>$("msg").innerHTML=`<span class="${ok?'ok':'err'}">${t}</span>`;
const PX_TO_PT = 0.75;

/* ===== Helpers ===== */
const digits = v=>String(v||"").replace(/\D+/g,'');
const rand = n=>Array.from({length:n},()=>Math.floor(Math.random()*10)).join('');

function makePricingCode(price){
  price = digits(price);
  if(price.length < 2 || price.length > 4) return null;
  return "13" + price + rand(8 - price.length);
}

/* ===== Arabic text as image ===== */
function textToImage(text, fontSize){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  ctx.font = `bold ${fontSize}px Tahoma`;
  const w = ctx.measureText(text).width + 20;
  const h = fontSize + 20;
  c.width = w; c.height = h;
  ctx.font = `bold ${fontSize}px Tahoma`;
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, w/2, h/2);
  return c.toDataURL("image/png");
}

/* ===== Barcode image ===== */
function barcodeImg(val){
  const c=document.createElement("canvas");
  JsBarcode(c,val,{format:"CODE128",displayValue:false,height:64,margin:0});
  return c.toDataURL("image/png");
}

/* ===== Camera scan (BarcodeDetector) ===== */
let stream=null, scanning=false;

async function startScan(){
  $("videoWrap").style.display="block";
  $("btnStop").style.display="block";
  $("scanStatus").textContent="فتح الكاميرا…";

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"},audio:false
    });
    const v=$("video");
    v.srcObject=stream;
    await v.play();

    const detector = new BarcodeDetector({formats:["code_128","ean_13","ean_8"]});
    scanning=true;
    $("scanStatus").textContent="وجّه الكاميرا على الباركود…";

    const loop = async ()=>{
      if(!scanning) return;
      const res = await detector.detect(v);
      if(res.length){
        const imei = digits(res[0].rawValue);
        if(imei.length>=10){
          $("imei").value=imei;
          stopScan();
          return;
        }
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    msg("فشل فتح الكاميرا (HTTPS مطلوب)",false);
    stopScan();
  }
}

function stopScan(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $("videoWrap").style.display="none";
  $("btnStop").style.display="none";
}

$("btnScan").onclick=()=>{msg("");startScan()};
$("btnStop").onclick=stopScan;

/* ===== PDF ===== */
$("btnPdf").onclick=()=>{
  const imei=digits($("imei").value);
  if(imei.length<10) return msg("IMEI غير صحيح",false);

  const code=makePricingCode($("price").value);
  if(!code) return msg("السعر من 2 إلى 4 أرقام",false);

  const w=parseInt($("w").value)||384;
  const h=parseInt($("h").value)||192;
  const pw=w*PX_TO_PT, ph=h*PX_TO_PT;

  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({
    orientation: w>=h?"landscape":"portrait",
    unit:"pt",
    format:[pw,ph]
  });

  doc.rect(1,1,pw-2,ph-2);

  const shopImg=textToImage("البحراني للهواتف الذكية",18);
  doc.addImage(shopImg,"PNG",(pw-220)/2,8,220,28);

  doc.setFont("helvetica","bold");
  doc.setFontSize(22);
  doc.text(code,pw/2,52,{align:"center"});

  doc.addImage(barcodeImg(imei),"PNG",10,64,pw-20,ph-96);

  doc.setFontSize(14);
  doc.text(imei,pw/2,ph-14,{align:"center"});

  doc.save(`Label_${imei}.pdf`);
  msg("✅ تم إنشاء PDF");
};
</script>
</body>
</html>
